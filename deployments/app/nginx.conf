# Web 静态站点 + API 反向代理。SSE（导购流式回答）关闭缓冲；实时语音走 WebSocket 升级。

# API 上游：
#   - keepalive 复用到 API 的连接：否则每个请求新建一条 TCP 连接，高并发时 nginx 的本地端口被 TIME_WAIT 占满（connect() failed (99)）；
#   - resolve + resolver：API 容器重建 / 滚动发布后 IP 会变，按 Docker 内置 DNS 定期重新解析（nginx ≥ 1.27.3），不用重载 nginx；
#     多实例（BLINK_API_REPLICAS）时 api 解析出多个地址，按轮询分发，某个实例连不上时换下一个（proxy_next_upstream 默认 error / timeout）。
upstream blink_api {
  zone blink_api 64k;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server api:8080 resolve;
  keepalive 64;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 11m; # 上传上限 10MB + multipart 余量

  # 安全响应头只加在静态页面的 location 里（security_headers 片段）：server 级的 add_header 会被 /api/ 继承，
  # 和后端自己设置的响应头叠加（重复的 nosniff、两份 CSP）。API 的响应头由后端负责。

  location = /healthz { access_log off; return 200 "ok\n"; }

  # /metrics 不经公网入口暴露
  location = /metrics { return 404; }

  location /api/v1/speech/realtime {
    proxy_pass http://blink_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
  }

  location /api/ {
    proxy_pass http://blink_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;          # SSE：逐条转发事件
    proxy_cache off;
    proxy_read_timeout 300s;      # 导购一次运行最长 2 分钟，留余量
  }

  # 前端是 hash 路由，所有页面都是 index.html
  location / {
    try_files $uri /index.html;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'" always;
  }
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'" always;
  }
}
