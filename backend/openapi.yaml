      operationId: shipMerchantOrder
      summary: 发货
      description: 商家只能把本店已支付（待发货）的订单改为 shipped；其他店铺的订单 404。
      parameters:
        - $ref: "#/components/parameters/OrderID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [shipped]
      responses:
        "200":
          $ref: "#/components/responses/OrderResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/OrderNotFound"
        "409":
          $ref: "#/components/responses/OrderStatusConflict"
  /admin/orders:
    get:
      tags: [admin]
      operationId: listAdminOrders
      summary: 全部订单
      parameters:
        - $ref: "#/components/parameters/OrderStatus"
        - $ref: "#/components/parameters/OrderNo"
        - name: merchant_id
          in: query
          required: false
          schema:
            type: string
        - name: account_id
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          $ref: "#/components/responses/OrderPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/orders/{id}:
    get:
      tags: [admin]
      operationId: getAdminOrder
      summary: 订单详情（管理员）
      parameters:
        - $ref: "#/components/parameters/OrderID"
      responses:
        "200":
          $ref: "#/components/responses/OrderResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/OrderNotFound"
    patch:
      tags: [admin]
      operationId: updateAdminOrder
      summary: 代发货或取消订单
      description: |
        管理员可以代商家发货（paid → shipped），或取消待支付订单（库存回补、券退回）。管理员同样受订单状态机约束，
        不能取消已支付的订单（上游允许管理员把订单改成任意状态）。
      parameters:
        - $ref: "#/components/parameters/OrderID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [shipped, cancelled]
                reason:
                  type: string
                  maxLength: 200
                  description: 取消原因，不填为“平台取消”。
      responses:
        "200":
          $ref: "#/components/responses/OrderResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/OrderNotFound"
        "409":
          $ref: "#/components/responses/OrderStatusConflict"
  /merchant/products:
    get:
      tags: [merchant]
      operationId: listMerchantProducts
      summary: 我的商品
      description: 当前商家的全部未删除商品（含下架、风控），最近修改的在前。上游没有这个接口（上游商家页从公开列表中筛选，看不到下架商品）。
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, inactive, risk]
        - name: keyword
          in: query
          required: false
          description: 按商品名称包含匹配。
          schema:
            type: string
            maxLength: 64
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 商品分页列表
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/MerchantProduct"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [merchant]
      operationId: createMerchantProduct
      summary: 创建商品
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: 创建成功
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantProduct"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /merchant/products/{id}:
    get:
      tags: [merchant]
      operationId: getMerchantProduct
      summary: 我的商品详情（含全部规格和状态）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 商品
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantProduct"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/MerchantProductNotFound"
    patch:
      tags: [merchant]
      operationId: updateMerchantProduct
      summary: 修改商品（部分更新）
      description: |
        只修改请求中出现的字段。`status` 只能在 active / inactive 之间切换（上架/下架）；风控中的商品不能自行上下架（409），
        但可以修改资料。`skus` 提交时整体替换规格列表：带 `sku_id` 的更新该规格（必须属于本商品），不带的新增，未出现的删除。
        只提交 `price` / `stock_quantity` 时修改默认规格。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "200":
          description: 修改后的商品
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantProduct"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/MerchantProductNotFound"
        "409":
          description: 风控审核中的商品不能自行上下架（`product_under_review`）
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: product_under_review
                message: 商品正在风控审核，不能自行上下架
                request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
    delete:
      tags: [merchant]
      operationId: deleteMerchantProduct
      summary: 删除商品（软删）
      description: 状态改为 deleted（终态）。公开目录和商家列表不再出现，订单快照不受影响。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 已删除
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                type: object
                required: [product_id, status]
                properties:
                  product_id:
                    type: string
                  status:
                    type: string
                    const: deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/MerchantProductNotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 登录后获得的不透明 token。
  headers:
    RequestID:
      description: 请求追踪 ID，与错误响应体中的 `request_id` 一致。
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,64}$"
    RetryAfter:
      description: 距离限流窗口重置的秒数。
      schema:
        type: integer
        minimum: 1
    Allow:
      description: 该路径支持的方法。
      schema:
        type: string
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: 页码，从 1 开始。
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      description: 每页条数，默认 10，最大 100。
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    OrderID:
      name: id
      in: path
      required: true
      schema:
        type: string
    OrderStatus:
      name: status
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/OrderStatus"
    OrderNo:
      name: order_no
      in: query
      required: false
      description: 按订单号精确查找。
      schema:
        type: string
    SessionID:
      name: id
      in: path
      required: true
      schema:
        type: string
    RunID:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    MerchantProduct:
      type: object
      description: 商家后台看到的商品：比公开结构多状态、全部规格和时间，不含商家名。
      required: [product_id, merchant_id, category_id, name, brand, image_url, image_urls, price, market_price, stock_quantity,
        stock_status, tags, selling_points, recommend_reason, risk_notes, attributes, suitable_for, not_suitable_for,
        description, status, skus, created_at, updated_at]
      properties:
        product_id:
          type: string
        merchant_id:
          type: string
        category_id:
          type: string
        name:
          type: string
        brand:
          type: string
        image_url:
          type: string
        image_urls:
          type: array
          items:
            type: string
        price:
          $ref: "#/components/schemas/Money"
        market_price:
          $ref: "#/components/schemas/Money"
        stock_quantity:
          type: integer
        stock_status:
          $ref: "#/components/schemas/StockStatus"
        tags:
          type: array
          items:
            type: string
        selling_points:
          type: array
          items:
            type: string
        recommend_reason:
          type: string
        risk_notes:
          type: array
          items:
            type: string
        attributes:
          type: array
          items:
            $ref: "#/components/schemas/ProductAttribute"
        suitable_for:
          type: array
          items:
            type: string
        not_suitable_for:
          type: array
          items:
            type: string
        description:
          type: string
        status:
          type: string
          enum: [active, inactive, risk]
        skus:
          type: array
          items:
            $ref: "#/components/schemas/ProductSku"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    MoneyInput:
      description: 金额，字符串（如 "12.30"）或数字；最多两位小数，不能为负，最大 99999999.99。
      oneOf:
        - type: string
        - type: number
    ProductInput:
      type: object
      description: |
        创建/修改商品。修改时缺省字段不变；创建时 name、category_id 必填，并在 `skus` 与 `price`（+ `stock_quantity`）之间二选一。
        字符串会去掉首尾空白；列表会去掉空白项和重复项。除 `description` 外的文本字段（名称、品牌、规格名及其属性、
        推荐理由、标签等列表项、参数）都是单行：含换行、制表符、回车、U+2028/U+2029 或其他控制字符返回 400 并指出 field；
        `description` 允许换行和制表符（`\r\n` 统一为 `\n`），其他控制字符同样拒绝。售价 = 默认规格价格，库存 = 各规格库存之和，库存状态由数量推导，不接受客户端指定。
      properties:
        merchant_id:
          type: string
          description: 只能省略或等于当前商家，否则 400。
        name:
          type: string
          maxLength: 128
        brand:
          type: string
          maxLength: 64
        category_id:
          type: string
          description: 必须是已有分类。
        image_url:
          type: string
          description: 主图。只接受 https 链接或平台内图片（`/api/v1/assets/...`，必须存在）；不在 image_urls 中时放到最前。
        image_urls:
          type: array
          maxItems: 9
          items:
            type: string
        price:
          $ref: "#/components/schemas/MoneyInput"
        market_price:
          description: 0 表示不展示划线价；非 0 时不能低于售价。创建时缺省等于售价。
          $ref: "#/components/schemas/MoneyInput"
        stock_quantity:
          type: integer
          minimum: 0
          maximum: 1000000
        stock_status:
          type: string
          deprecated: true
          description: 上游字段，忽略。
        tags:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 16
        selling_points:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 64
        risk_notes:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 64
        suitable_for:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 32
        not_suitable_for:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 32
        attributes:
          type: array
          maxItems: 30
          description: key、value 必填（全空的行忽略），key ≤16、value ≤64、unit ≤8 个字符。
          items:
            $ref: "#/components/schemas/ProductAttribute"
        recommend_reason:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        status:
          type: string
          enum: [active, inactive]
          description: 创建时缺省 active。
        skus:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/SkuInput"
    SkuInput:
      type: object
      required: [sku_name, price, stock_quantity]
      properties:
        sku_id:
          type: string
          description: 修改已有规格时填写，必须属于本商品；创建商品时不能填写。
        sku_name:
          type: string
          maxLength: 64
        price:
          $ref: "#/components/schemas/MoneyInput"
        stock_quantity:
          type: integer
          minimum: 0
          maximum: 1000000
        specs:
          type: object
          maxProperties: 10
          additionalProperties:
            type: string
            maxLength: 32
        is_default:
          type: boolean
          description: 至多一个；都不是时第一个为默认。
    Money:
      type: string
      pattern: "^[0-9]+\\.[0-9]{2}$"
      examples: ["2999.00"]
    Rate:
      type: string
      pattern: "^[01]\\.[0-9]{4}$"
      examples: ["0.9500"]
    StockStatus:
      type: string
      enum: [in_stock, low_stock, out_of_stock]
      description: 库存 0 为 out_of_stock，1–10 为 low_stock。
    CategoryNode:
      type: object
      required: [category_id, parent_id, name, children]
      properties:
        category_id:
          type: string
        parent_id:
          type: string
          description: 一级分类为空串。
        name:
          type: string
        children:
          type: array
          items:
            $ref: "#/components/schemas/CategoryNode"
    Merchant:
      type: object
      required: [merchant_id, name, logo_url, description, service_phone]
      properties:
        merchant_id:
          type: string
        name:
          type: string
        logo_url:
          type: string
        description:
          type: string
        service_phone:
          type: string
    ProductCard:
      type: object
      description: 商品列表项。所有数组字段始终存在（可能为空数组）。
      required: [product_id, sku_id, merchant_id, merchant_name, category_id, name, brand, image_url, price, market_price,
        stock_status, tags, selling_points, recommend_reason, risk_notes]
      properties:
        product_id:
          type: string
        sku_id:
          type: string
          description: 默认 SKU；商品没有 SKU 时为空串。
        merchant_id:
          type: string
        merchant_name:
          type: string
        category_id:
          type: string
        name:
          type: string
        brand:
          type: string
        image_url:
          type: string
          description: 可能是相对地址（`/api/v1/...`），客户端按 API 同源拼接；可能为空串。
        price:
          $ref: "#/components/schemas/Money"
        market_price:
          $ref: "#/components/schemas/Money"
        stock_status:
          $ref: "#/components/schemas/StockStatus"
        tags:
          type: array
          items:
            type: string
        selling_points:
          type: array
          items:
            type: string
        recommend_reason:
          type: string
        risk_notes:
          type: array
          description: 风险提示，例如“不支持游泳佩戴”。
          items:
            type: string
    ProductAttribute:
      type: object
      required: [key, value, unit]
      properties:
        key:
          type: string
        value:
          type: string
        unit:
          type: string
          description: 无单位时为空串。
    ProductDetail:
      allOf:
        - $ref: "#/components/schemas/ProductCard"
        - type: object
          required: [image_urls, stock_quantity, attributes, suitable_for, not_suitable_for, description]
          properties:
            image_urls:
              type: array
              items:
                type: string
            stock_quantity:
              type: integer
              minimum: 0
            attributes:
              type: array
              items:
                $ref: "#/components/schemas/ProductAttribute"
            suitable_for:
              type: array
              description: 适用人群/场景。
              items:
                type: string
            not_suitable_for:
              type: array
              description: 不适用人群/场景。
              items:
                type: string
            description:
              type: string
    ProductSku:
      type: object
      required: [sku_id, product_id, sku_name, price, stock_quantity, stock_status, specs, is_default]
      properties:
        sku_id:
          type: string
        product_id:
          type: string
        sku_name:
          type: string
        price:
          $ref: "#/components/schemas/Money"
        stock_quantity:
          type: integer
          minimum: 0
        stock_status:
          $ref: "#/components/schemas/StockStatus"
        specs:
          type: object
          additionalProperties:
            type: string
        is_default:
          type: boolean
    PublicReview:
      type: object
      required: [review_id, product_id, sku_id, reviewer_name, rating, content, tags, merchant_reply, merchant_replied_at, created_at]
      properties:
        review_id:
          type: string
        product_id:
          type: string
        sku_id:
          type: string
        reviewer_name:
          type: string
          description: 只保留首字符，如“演***”；账户已注销时为“匿名用户”。
        rating:
          type: integer
          minimum: 1
          maximum: 5
        content:
          type: string
        tags:
          type: array
          items:
            type: string
        merchant_reply:
          type: string
          description: 商家未回复时为空串。
        merchant_replied_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
    Promotion:
      type: object
      required: [promotion_id, name, scope, merchant_id, product_id, category_id, type, threshold_amount, discount_amount,
        discount_rate, stackable, start_at, end_at]
      properties:
        promotion_id:
          type: string
        name:
          type: string
        scope:
          type: string
          enum: [platform, merchant, product, category]
        merchant_id:
          type: string
        product_id:
          type: string
        category_id:
          type: string
        type:
          type: string
          enum: [full_reduction, discount]
          description: full_reduction 用 threshold_amount/discount_amount；discount 用 discount_rate（如 0.9500 表示 95 折）。
        threshold_amount:
          $ref: "#/components/schemas/Money"
        discount_amount:
          $ref: "#/components/schemas/Money"
        discount_rate:
          $ref: "#/components/schemas/Rate"
        stackable:
          type: boolean
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
    Role:
      type: string
      enum: [user, merchant, admin]
    AccountStatus:
      type: string
      enum: [active, inactive, risk]
    Account:
      type: object
      description: 账户。不含密码或哈希；`merchant_id` 只在商家账户出现。
      required: [account_id, username, display_name, avatar_url, phone, email, role, status, created_at, updated_at]
      properties:
        account_id:
          type: string
          examples: [acct_seed_user]
        username:
          type: string
        display_name:
          type: string
        avatar_url:
          type: string
          description: 空串表示未设置。
        phone:
          type: string
        email:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        merchant_id:
          type: string
        status:
          $ref: "#/components/schemas/AccountStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Session:
      type: object
      required: [token, token_type, expires_at, account]
      properties:
        token:
          type: string
          description: 不透明 token（43 位 base64url），只在这里出现一次。
        token_type:
          type: string
          const: Bearer
        expires_at:
          type: string
          format: date-time
        account:
          $ref: "#/components/schemas/Account"
    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[A-Za-z0-9_-]+$"
        password:
          type: string
          minLength: 8
          maxLength: 64
          description: 8–64 个字符，且不超过 72 字节。
          format: password
        display_name:
          type: string
          maxLength: 32
          description: 留空时使用用户名。
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    ProfileUpdateRequest:
      type: object
      description: 至少提供昵称或头像之一；空串和缺省都表示不修改。
      properties:
        display_name:
          type: string
          maxLength: 24
        nickname:
          type: string
          maxLength: 24
          description: 兼容字段，`display_name` 为空时使用。
        avatar_url:
          type: string
          description: 必须是本人通过 `POST /uploads/avatar` 上传、且仍存在的头像地址。
    ContactUpdateRequest:
      type: object
      description: 字段缺省表示不修改，空串表示清空；至少提供一个字段。
      properties:
        phone:
          type: string
          maxLength: 32
          pattern: "^[0-9+\\- ]*$"
        email:
          type: string
          maxLength: 128
          description: 空串或合法邮箱地址。
    AvatarUpload:
      type: object
      required: [url, mime_type, size]
      properties:
        url:
          type: string
          examples: [/api/v1/uploads/avatar/acct_seed_user_0123456789abcdef.png]
        mime_type:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        size:
          type: integer
          minimum: 1
          maximum: 2097152
    DocumentStatus:
      type: string
      enum: [uploaded, parsing, indexing, indexed, failed]
    DocType:
      type: string
      enum: [product_detail, faq, policy, guide, web_article, structured_note, unstructured_note]
    DocumentMetadata:
      type: object
      maxProperties: 20
      description: 扁平的附加信息：键 1–64 字，值只能是字符串（≤500 字）、数字、布尔或 null，整体不超过 4KB。
      additionalProperties:
        oneOf:
          - type: string
            maxLength: 500
          - type: number
          - type: boolean
          - type: "null"
    KnowledgeDocument:
      type: object
      required: [document_id, merchant_id, product_id, title, doc_type, status, chunk_count, source_url, content_hash, metadata, error_reason, created_at, updated_at]
      properties:
        document_id:
          type: string
        merchant_id:
          type: string
          description: 空串表示平台资料。
        product_id:
          type: string
          description: 关联的商品，可为空。
        title:
          type: string
          maxLength: 120
        doc_type:
          $ref: "#/components/schemas/DocType"
        status:
          $ref: "#/components/schemas/DocumentStatus"
        chunk_count:
          type: integer
          minimum: 0
        source_url:
          type: string
          description: 采集网页时为最终地址（跟随重定向后）。
        content_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: 清洗后正文的 SHA-256，同一商家内唯一。
        metadata:
          $ref: "#/components/schemas/DocumentMetadata"
        error_reason:
          type: string
          description: status 为 failed 时的原因。
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    KnowledgeDocumentDetail:
      allOf:
        - $ref: "#/components/schemas/KnowledgeDocument"
        - type: object
          required: [content, chunks]
          properties:
            content:
              type: string
              description: 清洗后的正文。
            chunks:
              type: array
              items:
                type: object
                required: [chunk_id, chunk_index, title, content]
                properties:
                  chunk_id:
                    type: string
                  chunk_index:
                    type: integer
                  title:
                    type: string
                  content:
                    type: string
                    maxLength: 800
    DocumentInput:
      type: object
      required: [title, content]
      properties:
        merchant_id:
          type: string
          description: 只能为空或当前商家，其他值 400（field=merchant_id）。
        title:
          type: string
          maxLength: 120
          description: 单行，不能含换行或控制字符。
        content:
          type: string
        doc_type:
          $ref: "#/components/schemas/DocType"
        product_id:
          type: string
          description: 必须是本店未删除的商品。
        metadata:
          $ref: "#/components/schemas/DocumentMetadata"
        force_reindex:
          type: boolean
    IngestionInput:
      type: object
      description: content、html、json_text、source_url 必须且只能提供一个。
      properties:
        merchant_id:
          type: string
          description: 只能为空或当前商家。
        title:
          type: string
          maxLength: 120
          description: 为空时从 <title> 或正文第一行推断。
        source_type:
          type: string
          enum: [text, html, json]
          description: 指定 content 或抓取结果的解析方式；为空时按字段或响应 Content-Type 判断。
        content:
          type: string
        html:
          type: string
        json_text:
          type: string
        source_url:
          type: string
          format: uri
          maxLength: 1024
        product_id:
          type: string
        metadata:
          $ref: "#/components/schemas/DocumentMetadata"
        force_reindex:
          type: boolean
    AdminIngestionInput:
      allOf:
        - $ref: "#/components/schemas/IngestionInput"
        - type: object
          properties:
            merchant_id:
              type: string
              description: 为空或不传时是平台资料；否则必须是已存在的商家。
    IngestionResult:
      type: object
      required: [document, duplicate, text_runes, truncated]
      properties:
        document:
          $ref: "#/components/schemas/KnowledgeDocument"
        duplicate:
          type: boolean
        text_runes:
          type: integer
          description: 清洗后正文的字数。
        truncated:
          type: boolean
          description: 清洗后超过 120000 字被截断。
    CartItem:
      type: object
      required: [cart_item_id, product_id, sku_id, product_name, sku_name, image_url, merchant_id, merchant_name, unit_price, quantity, selected, stock_quantity, available, unavailable_reason, amount, discount_amount, pay_amount]
      properties:
        cart_item_id:
          type: string
        product_id:
          type: string
        sku_id:
          type: string
        product_name:
          type: string
        sku_name:
          type: string
        image_url:
          type: string
        merchant_id:
          type: string
        merchant_name:
          type: string
        unit_price:
          $ref: "#/components/schemas/Money"
        quantity:
          type: integer
          minimum: 1
          maximum: 99
        selected:
          type: boolean
          description: 是否选中。不可购买（available=false）的项始终为 false；保存的选择不变，商品恢复后回到原来的状态。
        stock_quantity:
          type: integer
        available:
          type: boolean
        unavailable_reason:
          type: string
          description: 商品已删除 / 商品已下架 / 规格已失效 / 已售罄 / 库存不足，仅剩 N 件；可购买时为空串。
        amount:
          $ref: "#/components/schemas/Money"
        discount_amount:
          $ref: "#/components/schemas/Money"
          description: 分摊到该项的优惠；未选中或不可购买时为 0。
        pay_amount:
          $ref: "#/components/schemas/Money"
    Cart:
      type: object
      required: [items, summary]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        summary:
          type: object
          required: [item_count, selected_count, total_amount, discount_amount, pay_amount]
          properties:
            item_count:
              type: integer
              description: 购物车行数。
            selected_count:
              type: integer
              description: 参与计价（选中且可购买）的商品件数。
            total_amount:
              $ref: "#/components/schemas/Money"
            discount_amount:
              $ref: "#/components/schemas/Money"
            pay_amount:
              $ref: "#/components/schemas/Money"
    DiscountPreview:
      type: object
      required: [total_amount, discount_amount, pay_amount, lines, merchants, items, hints, user_coupon_ids]
      properties:
        total_amount:
          $ref: "#/components/schemas/Money"
        discount_amount:
          $ref: "#/components/schemas/Money"
        pay_amount:
          $ref: "#/components/schemas/Money"
        lines:
          type: array
          description: 逐项优惠，按计算顺序排列。
          items:
            type: object
            required: [type, id, name, scope, merchant_id, amount, description, cart_item_ids]
            properties:
              type:
                type: string
                enum: [promotion, coupon]
              id:
                type: string
                description: promotion_id 或 user_coupon_id。
              name:
                type: string
              scope:
                type: string
                enum: [platform, merchant, product, category]
              merchant_id:
                type: string
              amount:
                $ref: "#/components/schemas/Money"
              description:
                type: string
                examples: [满 300 减 30, 9.5 折]
              cart_item_ids:
                type: array
                description: 这条优惠分摊到的购物车项。
                items:
                  type: string
        merchants:
          type: array
          description: 按店铺小计（4.2 按店铺拆单）。
          items:
            type: object
            required: [merchant_id, merchant_name, total_amount, discount_amount, pay_amount]
            properties:
              merchant_id:
                type: string
              merchant_name:
                type: string
              total_amount:
                $ref: "#/components/schemas/Money"
              discount_amount:
                $ref: "#/components/schemas/Money"
              pay_amount:
                $ref: "#/components/schemas/Money"
        items:
          type: array
          items:
            type: object
            required: [cart_item_id, amount, discount_amount, pay_amount]
            properties:
              cart_item_id:
                type: string
              amount:
                $ref: "#/components/schemas/Money"
              discount_amount:
                $ref: "#/components/schemas/Money"
              pay_amount:
                $ref: "#/components/schemas/Money"
        hints:
          type: array
          description: 满减活动还差多少金额达到门槛（凑单提示）。
          items:
            type: object
            required: [promotion_id, name, shortfall]
            properties:
              promotion_id:
                type: string
              name:
                type: string
              shortfall:
                $ref: "#/components/schemas/Money"
        user_coupon_ids:
          type: array
          description: 实际使用的券。
          items:
            type: string
    Coupon:
      type: object
      required: [coupon_id, name, scope, merchant_id, type, threshold_amount, discount_amount, description, total_count, claimed_count, per_user_limit, start_at, end_at]
      properties:
        coupon_id:
          type: string
        name:
          type: string
        scope:
          type: string
          enum: [platform, merchant]
        merchant_id:
          type: string
        type:
          type: string
          enum: [fixed_amount]
        threshold_amount:
          $ref: "#/components/schemas/Money"
        discount_amount:
          $ref: "#/components/schemas/Money"
        description:
          type: string
          examples: [满 200 减 20]
        total_count:
          type: integer
          description: 0 表示不限量。
        claimed_count:
          type: integer
        per_user_limit:
          type: integer
          minimum: 1
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
          description: 不含该时刻。
    AvailableCoupon:
      allOf:
        - $ref: "#/components/schemas/Coupon"
        - type: object
          required: [claimed_by_me, can_claim]
          properties:
            claimed_by_me:
              type: integer
            can_claim:
              type: boolean
    UserCoupon:
      type: object
      required: [user_coupon_id, coupon_id, status, order_id, claimed_at, used_at, coupon]
      properties:
        user_coupon_id:
          type: string
        coupon_id:
          type: string
        status:
          type: string
          enum: [unused, used, expired]
        order_id:
          type: string
        claimed_at:
          type: string
          format: date-time
        used_at:
          type: [string, "null"]
          format: date-time
        coupon:
          $ref: "#/components/schemas/Coupon"
    OrderStatus:
      type: string
      enum: [pending_payment, paid, shipped, completed, cancelled]
      description: pending_payment 待支付 → paid 待发货 → shipped 已发货 → completed 已完成；只有待支付可以取消（含超时关闭）。
    PaymentStatus:
      type: string
      enum: [pending, paid, closed]
    OrderItem:
      type: object
      required: [order_item_id, product_id, sku_id, name, sku_name, image_url, price, quantity, amount, review_id]
      properties:
        order_item_id:
          type: string
        product_id:
          type: string
        sku_id:
          type: string
        name:
          type: string
          description: 下单时的商品名称（冻结，之后商品改名不影响）。
        sku_name:
          type: string
        image_url:
          type: string
        price:
          $ref: "#/components/schemas/Money"
          description: 下单时的单价（冻结）。
        quantity:
          type: integer
          minimum: 1
        amount:
          $ref: "#/components/schemas/Money"
          description: price × quantity。
        review_id:
          type: string
          description: 该商品的评价 ID，未评价为空串；只有订单详情填写，列表中总是空串。
    Payment:
      type: object
      required: [payment_id, amount, status, method, transaction_no, expires_at, paid_at]
      properties:
        payment_id:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
        status:
          $ref: "#/components/schemas/PaymentStatus"
        method:
          type: string
          description: 支付方式，未支付时为空串。
        transaction_no:
          type: string
          description: 模拟支付流水号（MOCK 开头），未支付时为空串。
        expires_at:
          type: string
          format: date-time
        paid_at:
          type: [string, "null"]
          format: date-time
    Order:
      type: object
      required: [order_id, order_no, account_id, merchant_id, merchant_name, status, total_amount, discount_amount, pay_amount,
        payment_deadline_at, paid_at, shipped_at, completed_at, closed_at, cancel_reason, items, created_at, updated_at]
      properties:
        order_id:
          type: string
        order_no:
          type: string
          description: BS + 下单时间（UTC，yyyyMMddHHmmss）+ 6 位数字。
        account_id:
          type: string
        merchant_id:
          type: string
        merchant_name:
          type: string
        status:
          $ref: "#/components/schemas/OrderStatus"
        total_amount:
          $ref: "#/components/schemas/Money"
        discount_amount:
          $ref: "#/components/schemas/Money"
          description: 活动和券分摊到本订单的优惠。
        pay_amount:
          $ref: "#/components/schemas/Money"
        payment_deadline_at:
          type: [string, "null"]
          format: date-time
        paid_at:
          type: [string, "null"]
          format: date-time
        shipped_at:
          type: [string, "null"]
          format: date-time
        completed_at:
          type: [string, "null"]
          format: date-time
        closed_at:
          type: [string, "null"]
          format: date-time
          description: 取消或超时关闭的时间。
        cancel_reason:
          type: string
          description: 取消原因；超时关闭为“支付超时自动关闭”。
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        payment:
          $ref: "#/components/schemas/Payment"
          description: 最新的支付单；只在详情和订单操作的响应中出现，列表中没有。
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CheckoutRequest:
      type: object
      properties:
        idempotency_key:
          type: string
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
          description: 幂等键；也可以放在 `Idempotency-Key` 请求头。
        user_coupon_ids:
          type: array
          maxItems: 20
          description: 不传时自动选最优券（与试算一致）；传了只用这些券，空数组表示不用券。
          items:
            type: string
        expected_pay_amount:
          $ref: "#/components/schemas/Money"
          description: 确认页显示的实付金额；与重新计算的金额不同时返回 409 `price_changed`，不下单。
    CheckoutResult:
      type: object
      required: [checkout_request_id, replayed, items]
      properties:
        checkout_request_id:
          type: string
        replayed:
          type: boolean
          description: true 表示同一幂等键已成功下过单，这里是那次的订单。
        items:
          type: array
          description: 每个店铺一个订单，按购物车中的先后顺序。
          items:
            $ref: "#/components/schemas/Order"
    MyReview:
      type: object
      required: [review_id, order_id, order_item_id, product_id, sku_id, rating, content, tags, status, created_at]
      properties:
        review_id:
          type: string
        order_id:
          type: string
        order_item_id:
          type: string
        product_id:
          type: string
        sku_id:
          type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
        content:
          type: string
        tags:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [visible, hidden]
        created_at:
          type: string
          format: date-time
    PromotionInput:
      type: object
      description: 创建时 name、减免金额或折扣率必填；修改时只改出现的字段。
      properties:
        name:
          type: string
          maxLength: 64
        scope:
          type: string
          enum: [merchant, product, category]
          default: merchant
        merchant_id:
          type: string
          description: 只能是自己的店铺，或者不传。
        product_id:
          type: string
          description: scope=product 时必填，必须是本店未删除的商品。
        category_id:
          type: string
          description: scope=category 时必填。
        type:
          type: string
          enum: [full_reduction, discount]
          default: full_reduction
        threshold_amount:
          $ref: "#/components/schemas/MoneyInput"
        discount_amount:
          $ref: "#/components/schemas/MoneyInput"
          description: 满减时必填，大于 0，门槛大于 0 时不能超过门槛。
        discount_rate:
          description: 折扣时必填，实付比例，大于 0 小于 1（0.95 = 9.5 折）。
          oneOf:
            - type: string
            - type: number
        stackable:
          type: boolean
          default: true
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [active, inactive]
          default: active
    MerchantPromotion:
      allOf:
        - $ref: "#/components/schemas/Promotion"
        - type: object
          required: [target_name, description, status, created_at, updated_at]
          properties:
            target_name:
              type: string
              description: 单品促销为商品名，品类促销为分类名，全店促销为空串。
            description:
              type: string
              description: 规则说明，与购物车优惠明细一致，例如“满 200 减 25”“9 折”。
            status:
              type: string
              enum: [active, inactive]
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    MerchantReview:
      type: object
      required: [review_id, order_id, product_id, product_name, sku_id, reviewer_name, rating, content, tags, status, merchant_reply, merchant_replied_at, created_at]
      properties:
        review_id:
          type: string
        order_id:
          type: string
        product_id:
          type: string
        product_name:
          type: string
        sku_id:
          type: string
        reviewer_name:
          type: string
          description: 脱敏后的显示名（只保留第一个字）。
        rating:
          type: integer
          minimum: 1
          maximum: 5
        content:
          type: string
        tags:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [visible, hidden]
        merchant_reply:
          type: string
        merchant_replied_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
    AdminAccount:
      type: object
      required: [account_id, username, display_name, role, merchant_id, status, created_at, updated_at]
      properties:
        account_id:
          type: string
        username:
          type: string
        display_name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        merchant_id:
          type: string
        status:
          $ref: "#/components/schemas/AccountStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AdminMerchant:
      allOf:
        - $ref: "#/components/schemas/Merchant"
        - type: object
          required: [service_phone, status, created_at, updated_at]
          properties:
            service_phone:
              type: string
            status:
              type: string
              enum: [active, inactive, risk]
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    AdminProduct:
      type: object
      required: [product_id, merchant_id, merchant_name, category_id, name, image_url, price, stock_quantity, stock_status, status, updated_at]
      properties:
        product_id:
          type: string
        merchant_id:
          type: string
        merchant_name:
          type: string
        category_id:
          type: string
        name:
          type: string
        image_url:
          type: string
        price:
          $ref: "#/components/schemas/Money"
        stock_quantity:
          type: integer
        stock_status:
          $ref: "#/components/schemas/StockStatus"
        status:
          type: string
          enum: [active, inactive, risk, deleted]
        updated_at:
          type: string
          format: date-time
    AdminReview:
      allOf:
        - $ref: "#/components/schemas/MerchantReview"
        - type: object
          required: [account_id, updated_at]
          properties:
            account_id:
              type: string
            updated_at:
              type: string
              format: date-time
    ConfigItem:
      type: object
      required: [key, env, description, value, source, secret, editable]
      properties:
        key:
          type: string
        env:
          type: string
          description: 对应的环境变量名。
        description:
          type: string
        value:
          type: string
          description: 当前生效的值；密钥只返回掩码（有值为 ******，未设置为空串）。
        source:
          type: string
          enum: [env, dynamic, default]
        secret:
          type: boolean
        editable:
          type: boolean
          description: 运行中可调、不是密钥、且没有被环境变量指定。
    RiskOverview:
      type: object
      required: [accounts, merchants, products, blocked_words, blocked_words_source, blocked_words_editable]
      properties:
        accounts:
          type: object
          additionalProperties:
            type: integer
        merchants:
          type: object
          additionalProperties:
            type: integer
        products:
          type: object
          additionalProperties:
            type: integer
        blocked_words:
          type: array
          items:
            type: string
        blocked_words_source:
          type: string
        blocked_words_editable:
          type: boolean
    AuditLog:
      type: object
      required: [audit_id, operator_id, operator_name, action, target_type, target_id, before_value, after_value, reason, request_id, created_at]
      properties:
        audit_id:
          type: string
        operator_id:
          type: string
        operator_name:
          type: string
        action:
          type: string
          description: 例如 account.status_changed、config.updated。
        target_type:
          type: string
        target_id:
          type: string
        before_value:
          type: string
        after_value:
          type: string
        reason:
          type: string
        request_id:
          type: string
        created_at:
          type: string
          format: date-time
    SpeechConfig:
      type: object
      required: [enabled, provider, voice, max_text_chars, stt]
      properties:
        enabled:
          type: boolean
          description: 语音合成（朗读）是否开通
        provider:
          type: string
          description: 合成供应商名（xunfei / doubao / mock），未开通为空
        voice:
          type: string
          description: 默认音色
        max_text_chars:
          type: integer
          description: 单次朗读最多字数
        stt:
          type: object
          required: [enabled, provider, sample_rate, encoding, max_seconds]
          properties:
            enabled:
              type: boolean
              description: 实时语音识别是否开通
            provider:
              type: string
            sample_rate:
              type: integer
              enum: [16000]
            encoding:
              type: string
              enum: [pcm_s16le]
            max_seconds:
              type: integer
              description: 单次语音输入最长秒数
    SpeechEvent:
      type: object
      description: 实时识别 WebSocket 上服务端推送的事件（JSON 文本帧）
      required: [type]
      properties:
        type:
          type: string
          enum: [ready, partial, final, end_of_input, error, closed]
        text:
          type: string
          description: partial / final 的整句文本
        seq:
          type: integer
          description: partial / final 的序号，从 1 开始
        code:
          type: string
          description: error 的错误码
        message:
          type: string
        reason:
          type: string
          enum: [max_duration]
        sample_rate:
          type: integer
          description: ready 时给出
        max_seconds:
          type: integer
          description: ready 时给出
    ImageSearchResult:
      type: object
      required: [status, embedder, items]
      properties:
        status:
          type: string
          enum: [matched, similar, no_match]
        embedder:
          type: string
          description: 图片向量的提供方、模型和维度（如 `local:color-edge-v1:160`），用于排查和评测对照。
        items:
          type: array
          description: 按相似度从高到低；低于相近阈值的不返回。
          items:
            $ref: "#/components/schemas/ImageMatch"
    ImageMatch:
      type: object
      required: [product, score, level, matched_image_url]
      properties:
        product:
          $ref: "#/components/schemas/ProductCard"
        score:
          type: number
          description: 余弦相似度（保留 4 位小数）
        level:
          type: string
          enum: [match, similar]
          description: match 达到同款阈值；similar 只是外观相近
        matched_image_url:
          type: string
          description: 该商品里最相似的那张图
    FileUpload:
      type: object
      required: [file]
      properties:
        file:
          $ref: "#/components/schemas/StoredFile"
    StoredFile:
      type: object
      required: [file_id, url, mime_type, size_bytes, content_hash, created_at]
      properties:
        file_id:
          type: string
          examples: [file_0123456789abcdef01234567]
        url:
          type: string
          description: 下载地址（需要登录，见 `GET /files/{id}`）。
          examples: [/api/v1/files/file_0123456789abcdef01234567]
        mime_type:
          type: string
          enum: [image/jpeg, image/png, image/webp, image/gif, image/bmp, application/pdf]
        size_bytes:
          type: integer
          minimum: 1
        content_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: 内容的 SHA-256（小写 hex）。
        created_at:
          type: string
          format: date-time
    OKResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ReadyResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          const: ready
        checks:
          type: object
          description: 每个依赖的检查结果。
          additionalProperties:
            type: string
            const: ok
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            机器可读错误码。通用错误码：`invalid_argument`、`invalid_json`、`unauthorized`、`forbidden`、`not_found`、
            `method_not_allowed`、`conflict`、`payload_too_large`、`unsupported_media_type`、`rate_limited`、
            `internal_error`、`not_ready`、`timeout`。认证相关：`invalid_credential`、`username_exists`、
            `account_inactive`、`account_risk`。目录：`product_not_found`。商家：`product_under_review`。订单：`order_not_found`、`order_item_not_found`、`empty_cart`、`item_unavailable`、`price_changed`、`order_status_conflict`、`order_expired`、`order_not_completed`、`review_exists`。商家营销：`promotion_not_found`、`review_not_found`。平台管理：`account_not_found`、`merchant_not_found`、`cannot_change_self`、`status_unchanged`、`invalid_status_transition`、`config_not_found`、`config_read_only`、`config_overridden_by_env`、`config_admin_unavailable`。导购：`session_not_found`、`run_not_found`、`run_finished`。
          examples: [not_found]
        message:
          type: string
          description: 可直接展示给用户的中文说明。
          examples: [接口不存在]
        field:
          type: string
          description: 校验失败的请求字段，如 `price`、`skus[1].sku_name`（数组下标从 0 开始）；与具体字段无关的错误不返回。
          examples: ["skus[0].price"]
        request_id:
          type: string
          description: 请求追踪 ID，与响应头 `X-Request-ID` 一致。
    PageMeta:
      type: object
      required: [page, page_size, total]
      properties:
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
    Page:
      description: 列表响应基础结构；具体接口用 allOf 合并并约束 `items` 的元素类型。
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {}
    ChatSession:
      type: object
      required: [session_id, title, summary, message_count, last_message_at, pinned, pinned_at, created_at, updated_at]
      properties:
        session_id:
          type: string
        title:
          type: string
        summary:
          type: string
        message_count:
          type: integer
        last_message_at:
          type: [string, "null"]
          format: date-time
        pinned:
          type: boolean
        pinned_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ChatSessionPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ChatSession"
    ChatSessionUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 128
        summary:
          type: string
          maxLength: 500
    ChatMessageRequest:
      type: object
      required: [client_message_id, content]
      properties:
        client_message_id:
          type: string
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
          description: 客户端生成，重试时复用；会话内唯一。
        content:
          type: string
          minLength: 1
          maxLength: 2000
          description: 去掉首尾空白后 1–2000 字。
        attachments:
          type: array
          maxItems: 10
          items:
            type: object
            required: [file_id]
            properties:
              file_id:
                type: string
                description: 本人通过 `POST /files` 上传的文件。
    ChatMessage:
      type: object
      required: [message_id, client_message_id, content, attachments, created_at, run]
      properties:
        message_id:
          type: string
        client_message_id:
          type: string
        content:
          type: string
        attachments:
          type: array
          items:
            type: object
            required: [file_id, mime_type]
            properties:
              file_id:
                type: string
              mime_type:
                type: string
        created_at:
          type: string
          format: date-time
        run:
          oneOf:
            - $ref: "#/components/schemas/AgentRun"
            - type: "null"
    ChatSessionDetail:
      type: object
      required: [session, messages]
      properties:
        session:
          $ref: "#/components/schemas/ChatSession"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
    AgentRunStatus:
      type: string
      enum: [queued, running, completed, failed, cancelled]
    AgentRun:
      type: object
      required: [run_id, session_id, message_id, trace_id, status, content, blocks, followups, error_code, created_at, updated_at]
      properties:
        run_id:
          type: string
        session_id:
          type: string
        message_id:
          type: string
        trace_id:
          type: string
        status:
          $ref: "#/components/schemas/AgentRunStatus"
        content:
          type: string
          description: 已生成的文字（取消或失败时为已输出的部分）。
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/AgentBlock"
        followups:
          type: array
          items:
            type: string
        error_code:
          type: string
          description: 失败或取消的原因：`cancelled`、`agent_error`、`run_timeout`、`server_shutdown`、`interrupted`；完成时为空。
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AgentBlock:
      type: object
      required: [type]
      description: |
        结构化块，全部由工具返回的数据生成，客户端只渲染不推断。按 `type` 区分：
        `product_list`（AgentBlockProductList）、`comparison`（AgentBlockComparison）、`citation`（AgentBlockCitation）、
        `action`（AgentBlockAction）、`cart`（AgentBlockCart）、`order_list`（AgentBlockOrderList）、`coupon_list`（AgentBlockCouponList）、
        `promotion_list`（AgentBlockPromotionList）、`review_list`（AgentBlockReviewList）。客户端遇到未知 `type` 应忽略而不是报错。
      properties:
        type:
          type: string
          enum: [product_list, comparison, citation, action, cart, order_list, coupon_list, promotion_list, review_list]
      additionalProperties: true
    AgentProductCard:
      type: object
      description: 商品卡：字段全部来自商品库（search_products 工具）。只有这里出现过的 product_id 才能被加购。
      required: [product_id, name, brand, image_url, price, market_price, stock_quantity, stock_status, merchant_id, merchant_name, category_id, category_name, tags, selling_points, recommend_reason, risk_notes, suitable_for, not_suitable_for, attributes, skus]
      properties:
        product_id:
          type: string
        name:
          type: string
        brand:
          type: string
        image_url:
          type: string
        price:
          $ref: "#/components/schemas/Money"
        market_price:
          $ref: "#/components/schemas/Money"
        stock_quantity:
          type: integer
        stock_status:
          $ref: "#/components/schemas/StockStatus"
        merchant_id:
          type: string
        merchant_name:
          type: string
        category_id:
          type: string
        category_name:
          type: string
        tags:
          type: array
          items:
            type: string
        selling_points:
          type: array
          items:
            type: string
        recommend_reason:
          type: string
        risk_notes:
          type: array
          items:
            type: string
        suitable_for:
          type: array
          items:
            type: string
        not_suitable_for:
          type: array
          items:
            type: string
        attributes:
          type: array
          items:
            $ref: "#/components/schemas/ProductAttribute"
        skus:
          type: array
          items:
            type: object
            required: [sku_id, sku_name, price, stock_quantity, stock_status, is_default]
            properties:
              sku_id:
                type: string
              sku_name:
                type: string
              price:
                $ref: "#/components/schemas/Money"
              stock_quantity:
                type: integer
              stock_status:
                $ref: "#/components/schemas/StockStatus"
              is_default:
                type: boolean
    AgentBlockProductList:
      type: object
      description: 块 `product_list`：推荐或候选商品，按展示顺序。“把第一个加购物车”按这个顺序解析。
      required: [type, title, products]
      properties:
        type:
          type: string
          const: product_list
        title:
          type: string
        products:
          type: array
          items:
            $ref: "#/components/schemas/AgentProductCard"
    AgentBlockComparison:
      type: object
      description: 块 `comparison`：对比表，rows 每行一个字段，values 与 products 一一对应。
      required: [type, products, rows]
      properties:
        type:
          type: string
          const: comparison
        products:
          type: array
          items:
            type: object
            required: [product_id, name, image_url]
            properties:
              product_id:
                type: string
              name:
                type: string
              image_url:
                type: string
        rows:
          type: array
          items:
            type: object
            required: [label, values]
            properties:
              label:
                type: string
              values:
                type: array
                items:
                  type: string
    AgentBlockCitation:
      type: object
      description: 块 `citation`：回答引用的知识分块（search_knowledge 工具）。
      required: [type, citations]
      properties:
        type:
          type: string
          const: citation
        citations:
          type: array
          items:
            type: object
            required: [chunk_id, document_id, merchant_id, title, document_title, snippet, source, score, matched_by]
            properties:
              chunk_id:
                type: string
              document_id:
                type: string
              merchant_id:
                type: string
              product_id:
                type: string
              title:
                type: string
              document_title:
                type: string
              snippet:
                type: string
              source:
                type: string
              source_url:
                type: string
              score:
                type: number
              matched_by:
                type: array
                items:
                  type: string
                  enum: [keyword, vector]
    AgentBlockAction:
      type: object
      description: 块 `action`：建议客户端执行的动作，目前只有 `navigate`。target 为 products / product_detail / cart / orders / order_detail / coupons / sessions / settings；params 带 product_id、order_id 等。
      required: [type, action, target, label, params]
      properties:
        type:
          type: string
          const: action
        action:
          type: string
          enum: [navigate]
        target:
          type: string
          enum: [products, product_detail, cart, orders, order_detail, coupons, sessions, settings]
        label:
          type: string
        params:
          type: object
          additionalProperties:
            type: string
    AgentBlockCart:
      description: 块 `cart`：购物车当前状态（与 GET /cart 的响应相同）加凑单提示。
      allOf:
        - $ref: "#/components/schemas/Cart"
        - type: object
          required: [type, hints]
          properties:
            type:
              type: string
              const: cart
            hints:
              type: array
              items:
                type: object
                required: [promotion_id, name, shortfall]
                properties:
                  promotion_id:
                    type: string
                  name:
                    type: string
                  shortfall:
                    $ref: "#/components/schemas/Money"
    AgentBlockOrderList:
      type: object
      description: 块 `order_list`：订单（与 GET /orders 的条目相同，操作结果带 payment）。
      required: [type, orders]
      properties:
        type:
          type: string
          const: order_list
        orders:
          type: array
          items:
            $ref: "#/components/schemas/Order"
    AgentBlockCouponList:
      type: object
      description: 块 `coupon_list`：可领的券（available，与 GET /coupons/available 的条目相同）和我的券（mine，与 GET /coupons/mine 的条目相同）。
      required: [type, available, mine]
      properties:
        type:
          type: string
          const: coupon_list
        available:
          type: array
          items:
            $ref: "#/components/schemas/AvailableCoupon"
        mine:
          type: array
          items:
            $ref: "#/components/schemas/UserCoupon"
    AgentBlockPromotionList:
      type: object
      description: 块 `promotion_list`：进行中的促销活动及说明。
      required: [type, promotions]
      properties:
        type:
          type: string
          const: promotion_list
        promotions:
          type: array
          items:
            type: object
            required: [promotion_id, name, scope, merchant_id, product_id, category_id, type, description, threshold_amount, stackable]
            properties:
              promotion_id:
                type: string
              name:
                type: string
              scope:
                type: string
              merchant_id:
                type: string
              product_id:
                type: string
              category_id:
                type: string
              type:
                type: string
              description:
                type: string
              threshold_amount:
                $ref: "#/components/schemas/Money"
              stackable:
                type: boolean
    AgentBlockReviewList:
      type: object
      description: 块 `review_list`：某商品的评价和评分摘要。
      required: [type, product_id, product_name, total, average_rating, reviews]
      properties:
        type:
          type: string
          const: review_list
        product_id:
          type: string
        product_name:
          type: string
        total:
          type: integer
        average_rating:
          type: number
        reviews:
          type: array
          items:
            type: object
            required: [review_id, rating, content, tags, reviewer_name, merchant_reply, created_at]
            properties:
              review_id:
                type: string
              rating:
                type: integer
              content:
                type: string
              tags:
                type: array
                items:
                  type: string
              reviewer_name:
                type: string
                description: 已脱敏的显示名。
              merchant_reply:
                type: string
              created_at:
                type: string
                description: 日期（YYYY-MM-DD）。
    AgentTraceEvent:
      type: object
      required: [trace_event_id, stage, event_type, model, status, duration_ms, error, metadata, created_at]
      properties:
        trace_event_id:
          type: string
        stage:
          type: string
          description: 例如 run（start / end）、planner、tool、answer。
        event_type:
          type: string
        model:
          type: string
        status:
          type: string
        duration_ms:
          type: integer
        error:
          type: string
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
    AgentRunTrace:
      type: object
      required: [run, items]
      properties:
        run:
          $ref: "#/components/schemas/AgentRun"
        items:
          type: array
          items:
            $ref: "#/components/schemas/AgentTraceEvent"
    AgentStreamEvent:
      type: object
      description: 事件流中的一帧：`event` 是类型，`data` 是对应结构。
      required: [event, data]
      properties:
        event:
          type: string
          enum: [message_start, thinking, text_delta, block, followups, message_done, error]
        data:
          oneOf:
            - $ref: "#/components/schemas/AgentEventMessageStart"
            - $ref: "#/components/schemas/AgentEventThinking"
            - $ref: "#/components/schemas/AgentEventTextDelta"
            - $ref: "#/components/schemas/AgentEventBlock"
            - $ref: "#/components/schemas/AgentEventFollowups"
            - $ref: "#/components/schemas/AgentEventMessageDone"
            - $ref: "#/components/schemas/AgentEventError"
    AgentEventMessageStart:
      type: object
      description: 事件 `message_start`，总是第一个。
      required: [run_id, message_id, session_id, trace_id, replayed]
      properties:
        run_id:
          type: string
        message_id:
          type: string
        session_id:
          type: string
        trace_id:
          type: string
        replayed:
          type: boolean
          description: true 表示重复提交，随后是保存的回答而不是重新运行。
    AgentEventThinking:
      type: object
      description: 事件 `thinking`：同一 id 的步骤以后到的状态为准。
      required: [step]
      properties:
        step:
          type: object
          required: [id, title, status]
          properties:
            id:
              type: string
            title:
              type: string
            status:
              type: string
              enum: [running, done]
    AgentEventTextDelta:
      type: object
      description: 事件 `text_delta`：按顺序拼接得到完整回答。
      required: [delta]
      properties:
        delta:
          type: string
    AgentEventBlock:
      type: object
      description: 事件 `block`：块的通用形状是 AgentBlock，按 `type` 对应到具体 schema。
      required: [block]
      properties:
        block:
          oneOf:
            - $ref: "#/components/schemas/AgentBlockProductList"
            - $ref: "#/components/schemas/AgentBlockComparison"
            - $ref: "#/components/schemas/AgentBlockCitation"
            - $ref: "#/components/schemas/AgentBlockAction"
            - $ref: "#/components/schemas/AgentBlockCart"
            - $ref: "#/components/schemas/AgentBlockOrderList"
            - $ref: "#/components/schemas/AgentBlockCouponList"
            - $ref: "#/components/schemas/AgentBlockPromotionList"
            - $ref: "#/components/schemas/AgentBlockReviewList"
    AgentEventFollowups:
      type: object
      description: 事件 `followups`：推荐的追问。
      required: [questions]
      properties:
        questions:
          type: array
          items:
            type: string
    AgentEventMessageDone:
      type: object
      description: 事件 `message_done`：正常结束。
      required: [run_id, status]
      properties:
        run_id:
          type: string
        status:
          type: string
          const: completed
    AgentEventError:
      type: object
      description: 事件 `error`：没有正常结束（取消、失败、超时、服务重启）。message 可直接展示。
      required: [run_id, code, message]
      properties:
        run_id:
          type: string
        code:
          type: string
          enum: [cancelled, agent_failed, run_timeout, server_shutdown, interrupted, internal_error]
        message:
          type: string
  responses:
    OK:
      description: 操作成功
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OKResponse"
    AccountResponse:
      description: 账户信息
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Account"
    MerchantProductNotFound:
      description: 商品不存在或已删除（`product_not_found`）
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: product_not_found
            message: 商品不存在或已删除
            request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
    ProductNotFound:
      description: 商品不存在，或已下架/风控/删除，或所属商家已停用（`product_not_found`）
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: product_not_found
            message: 商品不存在或已下架
            request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
    AccountStatusForbidden:
      description: 账户状态不允许该操作（`account_inactive` / `account_risk`）
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: account_risk
            message: 账号存在风险，暂时只能浏览
            request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
    BadRequest:
      description: 参数错误或请求体不是合法 JSON（`invalid_argument` / `invalid_json`）
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: invalid_json
            message: 请求体不是合法的 JSON
            request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
    Unauthorized:
      description: 未登录或登录已失效
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: unauthorized
            message: 请先登录
            request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
    Forbidden:
      description: 无权访问该资源
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: forbidden
            message: 没有权限
            request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
    NotFound:
      description: 路径或资源不存在
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: not_found
            message: 接口不存在
            request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
    MethodNotAllowed:
      description: 路径存在但不支持该方法
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Allow:
          $ref: "#/components/headers/Allow"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: method_not_allowed
            message: 不支持该请求方法
            request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
    Conflict:
      description: 幂等、状态或库存冲突
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: conflict
            message: 当前状态不允许该操作
            request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
    MerchantPromotionResponse:
      description: 促销
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MerchantPromotion"
    StatusChangeConflict:
      description: "`status_unchanged` 已经是该状态；`invalid_status_transition` 状态机不允许；`cannot_change_self` 不能改自己的账号"
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: invalid_status_transition
            message: 不能从“已删除”改为“正常”
    OrderResponse:
      description: 订单（含支付单）
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Order"
    OrderPage:
      description: 订单分页列表（按下单时间倒序，含订单项，不含支付单）
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/PageMeta"
              - type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
    OrderNotFound:
      description: 订单不存在，或不属于当前账户/店铺（`order_not_found`）
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: order_not_found
            message: 订单不存在
    OrderStatusConflict:
      description: 订单当前状态不允许该操作（`order_status_conflict`）
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: order_status_conflict
            message: 订单待发货，不能取消
    ObjectStorageUnavailable:
      description: 对象存储未配置或暂时不可用（`object_storage_unavailable`）
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: object_storage_unavailable
            message: 文件存储暂不可用，请稍后再试
    PayloadTooLarge:
      description: 请求体或文件过大
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: payload_too_large
            message: 请求体过大
            request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
    UnsupportedMediaType:
      description: 请求体不是 application/json
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: unsupported_media_type
            message: 请求体必须是 application/json
            request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
    TooManyRequests:
      description: 触发限流
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: rate_limited
            message: 请求过于频繁，请稍后再试
            request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
    InternalError:
      description: 服务内部错误（不回显内部细节）
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: internal_error
            message: 服务暂时不可用
            request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
    NotReady:
      description: 依赖不可用，服务尚未就绪
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: not_ready
            message: 依赖 mysql 不可用
            request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
    GatewayTimeout:
      description: 请求处理超时
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: timeout
            message: 请求处理超时，请稍后重试
            request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
