        至少 2 个字符）。名称、品牌、分类名、标签或卖点包含任一检索词即命中，不区分大小写；`%`、`_` 按字面匹配。
        关键词拆不出检索词（如单个字符）时返回空列表。`category_id` 同时匹配该分类及其子分类。按商品排序值、商品 ID 排序。
      security: []
      parameters:
        - name: keyword
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
        - name: category_id
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
