  /agent/sessions/{id}/messages:stream:
    post:
      tags: [agent]
      operationId: streamChatMessage
      summary: 发送消息并流式接收回答
      description: |
        先在一个事务里写入用户消息和运行，再以 `text/event-stream` 推送事件，每个事件立即发送（关闭代理缓冲），空闲时每 15 秒发一行注释心跳 `: ping`。
        帧格式：`event: <类型>` + `data: <JSON>` + 空行。顺序：`message_start` → 0..n 个 `thinking` / `text_delta` / `block` / `followups`
        → 恰好一个 `message_done`（status=completed）或 `error`。各事件的 data 见 AgentEvent* schema。

        - 幂等：`client_message_id` 在会话内唯一。同一 ID 再次提交不会再运行：`message_start.replayed=true`，随后一次性重放保存的回答
          （一个 `text_delta`、各 `block`、`followups`）和结束事件；运行还没结束时保持连接、等它结束再重放。
        - 取消：客户端断开或调用 `POST /agent/runs/{id}:cancel` 都会取消运行，状态写为 cancelled，已生成的内容保留；
          显式取消时流以 `error{code: cancelled}` 结束。
        - 失败：运行出错、超过 2 分钟或服务关闭时状态写为 failed（error_code 为 `agent_error` / `run_timeout` / `server_shutdown`），
          流以 `error` 结束，`message` 是可展示的中文，不含内部细节。服务启动时把上一个进程没跑完的运行标为 failed（`interrupted`）。
        - 开始流式输出前的错误（校验、会话不存在、未登录、限流）以普通 JSON 错误返回。
      parameters:
        - $ref: "#/components/parameters/SessionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageRequest"
      responses:
        "200":
          description: 事件流
          headers:
            X-Request-ID:
