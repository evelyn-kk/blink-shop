              example:
                code: cart_item_not_found
                message: 购物车项不存在
        "409":
          description: "`insufficient_stock` 数量超过库存；`out_of_stock` 已售罄；`item_unavailable` 商品已下架、删除或规格失效。改数量或要选中（含保持选中）时检查"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: item_unavailable
                message: 商品已失效，只能删除
    delete:
      tags: [cart]
      operationId: deleteCartItem
      summary: 删除购物车项
      responses:
        "200":
          description: 操作后的整个购物车
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: 购物车项不存在（`cart_item_not_found`）
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: cart_item_not_found
                message: 购物车项不存在
