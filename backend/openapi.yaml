openapi: 3.1.0
info:
  title: Blink Shop API
  version: 0.3.0
  description: |
    Blink Shop 的单一接口契约。约定：
    - 所有路径前缀为 `/api/v1`，JSON 字段使用 snake_case。
    - 成功响应直接返回业务对象，不包 `data` 外层。
    - 失败响应统一为 `Error`；状态码含义见 `docs/03-api-contract.md`。
    - 每个响应都带 `X-Request-ID`；请求可携带 `X-Request-ID`（1–64 位字母、数字、`.`、`_`、`-`），否则由服务端生成。
    - 请求体上限：JSON 默认 1 MiB，multipart 上传默认 10 MiB，超限返回 413。
    - 未登录请求按客户端 IP 限流，已登录请求另按账号限流，超限返回 429 并带 `Retry-After`。
    - 非流式请求默认 30 秒超时，超时返回 504。
    - 未知路径返回 404，路径存在但方法不支持返回 405（带 `Allow` 头），均为 `Error` JSON。
    - 认证：`Authorization: Bearer <token>`。token 由注册/登录返回，服务端只保存 SHA-256 摘要，默认 24 小时过期（`AUTH_TOKEN_TTL`），登出即撤销。
      token 缺失返回 401 `unauthorized`（请先登录）；过期、撤销或伪造同样 401 `unauthorized`（登录已失效）。
    - 角色：路由分为 public / session / account / user / merchant / admin 六类，角色不符返回 403 `forbidden`；
      商家只能操作自己店铺的资源，越权 403。完整矩阵见 backend/README.md。
    - 账户状态：inactive 只能调用 `GET /auth/me` 与 `POST /auth/logout`，其余 403 `account_inactive`；
      risk 可以读（GET）和登出，任何写操作 403 `account_risk`；两者都不能新登录。已注销账户的 token 全部失效。
    - 分页参数 `page` 从 1 开始，`page_size` 默认 10、最大 100；列表响应使用 `Page` 结构。
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
    description: 与当前访问地址同源（本地开发为 http://localhost:8080）
security:
  - bearerAuth: []
tags:
  - name: health
    description: 进程存活与就绪检查
  - name: auth
    description: 注册、登录、登出与当前会话
  - name: account
    description: 个人资料、联系方式、头像与注销
paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: 进程存活检查
      description: 只表示进程存活，不检查数据库等依赖；不参与限流。
      security: []
      responses:
        "200":
          description: 进程存活
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /ready:
    get:
      tags: [health]
      operationId: getReady
      summary: 就绪检查
      description: 检查数据库是否可用；不可用时返回 503，具体原因只写服务端日志。不参与限流。
      security: []
      responses:
        "200":
          description: 所有依赖可用
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
              example:
                status: ready
                checks:
                  mysql: ok
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/NotReady"
  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: 注册普通用户
      description: 只能注册 `user` 角色。成功后直接返回会话，等同于登录。用户名不区分大小写，已注销账户的用户名不可复用。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: 注册成功
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: 用户名已存在（`username_exists`）
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: username_exists
                message: 账号已存在
                request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: 用户名密码登录
      description: |
        用户不存在、已注销和密码错误统一返回 401 `invalid_credential`。密码正确但账户 inactive/risk 时返回 403
        `account_inactive` / `account_risk`。同一用户名每分钟最多尝试 `LOGIN_ATTEMPTS_PER_MINUTE` 次（默认 10），超出 429。
        旧版 SHA-256 密码哈希在登录成功后自动升级为 bcrypt。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: 账号或密码错误（`invalid_credential`）
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: invalid_credential
                message: 账号或密码错误
                request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
        "403":
          $ref: "#/components/responses/AccountStatusForbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: 登出
      description: 撤销本次请求使用的 token，同一账户的其他会话不受影响。inactive/risk 账户也可调用。
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: 当前登录账户
      description: inactive/risk 账户也可调用，客户端据 `status` 展示受限提示。
      responses:
        "200":
          $ref: "#/components/responses/AccountResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /account/profile:
    get:
      tags: [account]
      operationId: getProfile
      summary: 读取个人资料
      responses:
        "200":
          $ref: "#/components/responses/AccountResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountStatusForbidden"
    patch:
      tags: [account]
      operationId: updateProfile
      summary: 修改昵称或头像
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdateRequest"
      responses:
        "200":
          $ref: "#/components/responses/AccountResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountStatusForbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /account/contact:
    patch:
      tags: [account]
      operationId: updateContact
      summary: 修改手机号和邮箱
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactUpdateRequest"
      responses:
        "200":
          $ref: "#/components/responses/AccountResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountStatusForbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /account:
    delete:
      tags: [account]
      operationId: deleteAccount
      summary: 注销账户
      description: 软删账户并撤销其全部 token；用户名不可再注册。inactive/risk 账户不能注销。
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountStatusForbidden"
  /uploads/avatar:
    post:
      tags: [account]
      operationId: uploadAvatar
      summary: 上传头像
      description: |
        multipart 字段 `file`，最大 2MB；按文件内容判断类型，只接受 JPG、PNG、WebP。只返回地址，
        需要再调用 `PATCH /account/profile` 设置 `avatar_url`。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  contentMediaType: application/octet-stream
      responses:
        "200":
          description: 上传成功
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarUpload"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountStatusForbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /uploads/avatar/{name}:
    get:
      tags: [account]
      operationId: getAvatar
      summary: 读取头像（公开）
      security: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            pattern: "^acct_[A-Za-z0-9_]{1,64}_[0-9a-f]{16}\\.(jpg|png|webp)$"
      responses:
        "200":
          description: 图片内容
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            image/jpeg: {}
            image/png: {}
            image/webp: {}
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 登录后获得的不透明 token。
  headers:
    RequestID:
      description: 请求追踪 ID，与错误响应体中的 `request_id` 一致。
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,64}$"
    RetryAfter:
      description: 距离限流窗口重置的秒数。
      schema:
        type: integer
        minimum: 1
    Allow:
      description: 该路径支持的方法。
      schema:
        type: string
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: 页码，从 1 开始。
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      description: 每页条数，默认 10，最大 100。
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
  schemas:
    Role:
      type: string
      enum: [user, merchant, admin]
    AccountStatus:
      type: string
      enum: [active, inactive, risk]
    Account:
      type: object
      description: 账户。不含密码或哈希；`merchant_id` 只在商家账户出现。
      required: [account_id, username, display_name, avatar_url, phone, email, role, status, created_at, updated_at]
      properties:
        account_id:
          type: string
          examples: [acct_seed_user]
        username:
          type: string
        display_name:
          type: string
        avatar_url:
          type: string
          description: 空串表示未设置。
        phone:
          type: string
        email:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        merchant_id:
          type: string
        status:
          $ref: "#/components/schemas/AccountStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Session:
      type: object
      required: [token, token_type, expires_at, account]
      properties:
        token:
          type: string
          description: 不透明 token（43 位 base64url），只在这里出现一次。
        token_type:
          type: string
          const: Bearer
        expires_at:
          type: string
          format: date-time
        account:
          $ref: "#/components/schemas/Account"
    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[A-Za-z0-9_-]+$"
        password:
          type: string
          minLength: 8
          maxLength: 64
          description: 8–64 个字符，且不超过 72 字节。
          format: password
        display_name:
          type: string
          maxLength: 32
          description: 留空时使用用户名。
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    ProfileUpdateRequest:
      type: object
      description: 至少提供昵称或头像之一；空串和缺省都表示不修改。
      properties:
        display_name:
          type: string
          maxLength: 24
        nickname:
          type: string
          maxLength: 24
          description: 兼容字段，`display_name` 为空时使用。
        avatar_url:
          type: string
          description: 必须是本人通过 `POST /uploads/avatar` 上传、且仍存在的头像地址。
    ContactUpdateRequest:
      type: object
      description: 字段缺省表示不修改，空串表示清空；至少提供一个字段。
      properties:
        phone:
          type: string
          maxLength: 32
          pattern: "^[0-9+\\- ]*$"
        email:
          type: string
          maxLength: 128
          description: 空串或合法邮箱地址。
    AvatarUpload:
      type: object
      required: [url, mime_type, size]
      properties:
        url:
          type: string
          examples: [/api/v1/uploads/avatar/acct_seed_user_0123456789abcdef.png]
        mime_type:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        size:
          type: integer
          minimum: 1
          maximum: 2097152
    OKResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ReadyResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          const: ready
        checks:
          type: object
          description: 每个依赖的检查结果。
          additionalProperties:
            type: string
            const: ok
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            机器可读错误码。通用错误码：`invalid_argument`、`invalid_json`、`unauthorized`、`forbidden`、`not_found`、
            `method_not_allowed`、`conflict`、`payload_too_large`、`unsupported_media_type`、`rate_limited`、
            `internal_error`、`not_ready`、`timeout`。认证相关：`invalid_credential`、`username_exists`、
            `account_inactive`、`account_risk`。
          examples: [not_found]
        message:
          type: string
          description: 可直接展示给用户的中文说明。
          examples: [接口不存在]
        request_id:
          type: string
          description: 请求追踪 ID，与响应头 `X-Request-ID` 一致。
    PageMeta:
      type: object
      required: [page, page_size, total]
      properties:
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
    Page:
      description: 列表响应基础结构；具体接口用 allOf 合并并约束 `items` 的元素类型。
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {}
  responses:
    OK:
      description: 操作成功
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OKResponse"
    AccountResponse:
      description: 账户信息
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Account"
    AccountStatusForbidden:
      description: 账户状态不允许该操作（`account_inactive` / `account_risk`）
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: account_risk
            message: 账号存在风险，暂时只能浏览
            request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
    BadRequest:
      description: 参数错误或请求体不是合法 JSON（`invalid_argument` / `invalid_json`）
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: invalid_json
            message: 请求体不是合法的 JSON
            request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
    Unauthorized:
      description: 未登录或登录已失效
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: unauthorized
            message: 请先登录
            request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
    Forbidden:
      description: 无权访问该资源
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: forbidden
            message: 没有权限
            request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
    NotFound:
      description: 路径或资源不存在
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: not_found
            message: 接口不存在
            request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
    MethodNotAllowed:
      description: 路径存在但不支持该方法
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Allow:
          $ref: "#/components/headers/Allow"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: method_not_allowed
            message: 不支持该请求方法
            request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
    Conflict:
      description: 幂等、状态或库存冲突
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: conflict
            message: 当前状态不允许该操作
            request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
    PayloadTooLarge:
      description: 请求体或文件过大
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: payload_too_large
            message: 请求体过大
            request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
    UnsupportedMediaType:
      description: 请求体不是 application/json
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: unsupported_media_type
            message: 请求体必须是 application/json
            request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
    TooManyRequests:
      description: 触发限流
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: rate_limited
            message: 请求过于频繁，请稍后再试
            request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
    InternalError:
      description: 服务内部错误（不回显内部细节）
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: internal_error
            message: 服务暂时不可用
            request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
    NotReady:
      description: 依赖不可用，服务尚未就绪
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: not_ready
            message: 依赖 mysql 不可用
