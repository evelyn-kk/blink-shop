openapi: 3.1.0
info:
  title: Blink Shop API
  version: 0.5.0
  description: |
    Blink Shop 的单一接口契约。约定：
    - 所有路径前缀为 `/api/v1`，JSON 字段使用 snake_case。
    - 成功响应直接返回业务对象，不包 `data` 外层。
    - 失败响应统一为 `Error`；状态码含义见 `docs/03-api-contract.md`。
    - 每个响应都带 `X-Request-ID`；请求可携带 `X-Request-ID`（1–64 位字母、数字、`.`、`_`、`-`），否则由服务端生成。
    - 请求体上限：JSON 默认 1 MiB，multipart 上传默认 10 MiB，超限返回 413。
    - 未登录请求按客户端 IP 限流，已登录请求另按账号限流，超限返回 429 并带 `Retry-After`。
    - 非流式请求默认 30 秒超时，超时返回 504。
    - 未知路径返回 404，路径存在但方法不支持返回 405（带 `Allow` 头），均为 `Error` JSON。
    - 认证：`Authorization: Bearer <token>`。token 由注册/登录返回，服务端只保存 SHA-256 摘要，默认 24 小时过期（`AUTH_TOKEN_TTL`），登出即撤销。
      token 缺失返回 401 `unauthorized`（请先登录）；过期、撤销或伪造同样 401 `unauthorized`（登录已失效）。
    - 角色：路由分为 public / session / account / user / merchant / admin 六类，角色不符返回 403 `forbidden`；
      商家只能操作自己店铺的资源，越权 403。完整矩阵见 backend/README.md。
    - 账户状态：inactive 只能调用 `GET /auth/me` 与 `POST /auth/logout`，其余 403 `account_inactive`；
      risk 可以读（GET）和登出，任何写操作 403 `account_risk`；两者都不能新登录。已注销账户的 token 全部失效。
    - 分页参数 `page` 从 1 开始，`page_size` 默认 10、最大 100；列表响应使用 `Page` 结构。
      参数缺省或不是整数时取默认值，超出范围时取边界值（与上游一致，不报 400），响应中的 `page`/`page_size` 为实际使用的值。
    - 金额是两位小数的字符串（如 `"2999.00"`），比例是四位小数的字符串（如 `"0.9500"`）。
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
    description: 与当前访问地址同源（本地开发为 http://localhost:8080）
security:
  - bearerAuth: []
tags:
  - name: health
    description: 进程存活与就绪检查
  - name: auth
    description: 注册、登录、登出与当前会话
  - name: account
    description: 个人资料、联系方式、头像与注销
  - name: merchant
    description: 商家后台。merchant_id 一律由登录账号决定；其他商家的资源 403，不存在或已删除 404
  - name: catalog
    description: 公开商品目录（无需登录）。只展示上架且商家营业中的商品；下架、风控、已删除商品按不存在处理
paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: 进程存活检查
      description: 只表示进程存活，不检查数据库等依赖；不参与限流。
      security: []
      responses:
        "200":
          description: 进程存活
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /ready:
    get:
      tags: [health]
      operationId: getReady
      summary: 就绪检查
      description: 检查数据库是否可用；不可用时返回 503，具体原因只写服务端日志。不参与限流。
      security: []
      responses:
        "200":
          description: 所有依赖可用
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
              example:
                status: ready
                checks:
                  mysql: ok
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/NotReady"
  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: 注册普通用户
      description: 只能注册 `user` 角色。成功后直接返回会话，等同于登录。用户名不区分大小写，已注销账户的用户名不可复用。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: 注册成功
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: 用户名已存在（`username_exists`）
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: username_exists
                message: 账号已存在
                request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: 用户名密码登录
      description: |
        用户不存在、已注销和密码错误统一返回 401 `invalid_credential`。密码正确但账户 inactive/risk 时返回 403
        `account_inactive` / `account_risk`。同一用户名每分钟最多尝试 `LOGIN_ATTEMPTS_PER_MINUTE` 次（默认 10），超出 429。
        旧版 SHA-256 密码哈希在登录成功后自动升级为 bcrypt。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: 账号或密码错误（`invalid_credential`）
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: invalid_credential
                message: 账号或密码错误
                request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
        "403":
          $ref: "#/components/responses/AccountStatusForbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: 登出
      description: 撤销本次请求使用的 token，同一账户的其他会话不受影响。inactive/risk 账户也可调用。
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: 当前登录账户
      description: inactive/risk 账户也可调用，客户端据 `status` 展示受限提示。
      responses:
        "200":
          $ref: "#/components/responses/AccountResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /account/profile:
    get:
      tags: [account]
      operationId: getProfile
      summary: 读取个人资料
      responses:
        "200":
          $ref: "#/components/responses/AccountResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountStatusForbidden"
    patch:
      tags: [account]
      operationId: updateProfile
      summary: 修改昵称或头像
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdateRequest"
      responses:
        "200":
          $ref: "#/components/responses/AccountResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountStatusForbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /account/contact:
    patch:
      tags: [account]
      operationId: updateContact
      summary: 修改手机号和邮箱
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactUpdateRequest"
      responses:
        "200":
          $ref: "#/components/responses/AccountResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountStatusForbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /account:
    delete:
      tags: [account]
      operationId: deleteAccount
      summary: 注销账户
      description: 软删账户并撤销其全部 token；用户名不可再注册。inactive/risk 账户不能注销。
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountStatusForbidden"
  /uploads/avatar:
    post:
      tags: [account]
      operationId: uploadAvatar
      summary: 上传头像
      description: |
        multipart 字段 `file`，最大 2MB；按文件内容判断类型，只接受 JPG、PNG、WebP。只返回地址，
        需要再调用 `PATCH /account/profile` 设置 `avatar_url`。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  contentMediaType: application/octet-stream
      responses:
        "200":
          description: 上传成功
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarUpload"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountStatusForbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /uploads/avatar/{name}:
    get:
      tags: [account]
      operationId: getAvatar
      summary: 读取头像（公开）
      security: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            pattern: "^acct_[A-Za-z0-9_]{1,64}_[0-9a-f]{16}\\.(jpg|png|webp)$"
      responses:
        "200":
          description: 图片内容
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            image/jpeg: {}
            image/png: {}
            image/webp: {}
        "404":
          $ref: "#/components/responses/NotFound"
  /categories/tree:
    get:
      tags: [catalog]
      operationId: getCategoryTree
      summary: 分类树
      security: []
      responses:
        "200":
          description: 两级分类树，按 sort_order 排序
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CategoryNode"
  /merchants:
    get:
      tags: [catalog]
      operationId: listMerchants
      summary: 营业中的商家
      security: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 商家分页列表，按 merchant_id 排序
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Merchant"
  /products:
    get:
      tags: [catalog]
      operationId: listProducts
      summary: 搜索商品
      description: |
        `keyword` 拆成检索词：完整关键词，加上按“汉字 / 字母数字”切分的片段，汉字片段再展开为 2–4 字 n-gram（最多 10 个，
        至少 2 个字符）。名称、品牌、分类名、标签或卖点包含任一检索词即命中，不区分大小写；`%`、`_` 按字面匹配。
        关键词拆不出检索词（如单个字符）时返回空列表。`category_id` 同时匹配该分类及其子分类。按商品排序值、商品 ID 排序。
      security: []
      parameters:
        - name: keyword
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
        - name: category_id
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 商品卡片分页列表
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/ProductCard"
        "400":
          $ref: "#/components/responses/BadRequest"
  /products/{id}:
    get:
      tags: [catalog]
      operationId: getProduct
      summary: 商品详情
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 商品详情
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
        "404":
          $ref: "#/components/responses/ProductNotFound"
  /products/{id}/skus:
    get:
      tags: [catalog]
      operationId: listProductSkus
      summary: 商品 SKU
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: SKU 分页列表，默认 SKU 在前
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/ProductSku"
        "404":
          $ref: "#/components/responses/ProductNotFound"
  /products/{id}/reviews:
    get:
      tags: [catalog]
      operationId: listProductReviews
      summary: 商品公开评价
      description: 只返回 visible 评价，按评价时间倒序。评价人显示名脱敏，不返回账户、用户名和订单信息。
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 评价分页列表
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/PublicReview"
        "404":
          $ref: "#/components/responses/ProductNotFound"
  /promotions:
    get:
      tags: [catalog]
      operationId: listPromotions
      summary: 当前有效的促销
      description: |
        只返回 active、当前时间在 `[start_at, end_at)` 内、所属商家（如有）营业中的促销，按创建时间倒序。
        带 `product_id` 时只返回适用于该商品的促销：平台、该商品商家、指定该商品、作用于商品分类或其父分类的促销。
      security: []
      parameters:
        - name: product_id
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 促销分页列表
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Promotion"
        "404":
          $ref: "#/components/responses/ProductNotFound"
  /assets/{path}:
    get:
      tags: [catalog]
      operationId: getAsset
      summary: 内嵌静态资源（演示商品图、商家 logo）
      security: []
      parameters:
        - name: path
          in: path
          required: true
          description: 例如 `catalog/products/p_seed_nova.png`；目录不列出。
          schema:
            type: string
      responses:
        "200":
          description: 文件内容
          content:
            image/png: {}
        "404":
          $ref: "#/components/responses/NotFound"
  /merchant/products:
    get:
      tags: [merchant]
      operationId: listMerchantProducts
      summary: 我的商品
      description: 当前商家的全部未删除商品（含下架、风控），最近修改的在前。上游没有这个接口（上游商家页从公开列表中筛选，看不到下架商品）。
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, inactive, risk]
        - name: keyword
          in: query
          required: false
          description: 按商品名称包含匹配。
          schema:
            type: string
            maxLength: 64
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 商品分页列表
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/MerchantProduct"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [merchant]
      operationId: createMerchantProduct
      summary: 创建商品
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: 创建成功
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantProduct"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /merchant/products/{id}:
    get:
      tags: [merchant]
      operationId: getMerchantProduct
      summary: 我的商品详情（含全部规格和状态）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 商品
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantProduct"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/MerchantProductNotFound"
    patch:
      tags: [merchant]
      operationId: updateMerchantProduct
      summary: 修改商品（部分更新）
      description: |
        只修改请求中出现的字段。`status` 只能在 active / inactive 之间切换（上架/下架）；风控中的商品不能自行上下架（409），
        但可以修改资料。`skus` 提交时整体替换规格列表：带 `sku_id` 的更新该规格（必须属于本商品），不带的新增，未出现的删除。
        只提交 `price` / `stock_quantity` 时修改默认规格。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "200":
          description: 修改后的商品
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantProduct"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/MerchantProductNotFound"
        "409":
          description: 风控审核中的商品不能自行上下架（`product_under_review`）
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: product_under_review
                message: 商品正在风控审核，不能自行上下架
                request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
    delete:
      tags: [merchant]
      operationId: deleteMerchantProduct
      summary: 删除商品（软删）
      description: 状态改为 deleted（终态）。公开目录和商家列表不再出现，订单快照不受影响。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 已删除
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                type: object
                required: [product_id, status]
                properties:
                  product_id:
                    type: string
                  status:
                    type: string
                    const: deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/MerchantProductNotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 登录后获得的不透明 token。
  headers:
    RequestID:
      description: 请求追踪 ID，与错误响应体中的 `request_id` 一致。
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,64}$"
    RetryAfter:
      description: 距离限流窗口重置的秒数。
      schema:
        type: integer
        minimum: 1
    Allow:
      description: 该路径支持的方法。
      schema:
        type: string
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: 页码，从 1 开始。
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      description: 每页条数，默认 10，最大 100。
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
  schemas:
    MerchantProduct:
      type: object
      description: 商家后台看到的商品：比公开结构多状态、全部规格和时间，不含商家名。
      required: [product_id, merchant_id, category_id, name, brand, image_url, image_urls, price, market_price, stock_quantity,
        stock_status, tags, selling_points, recommend_reason, risk_notes, attributes, suitable_for, not_suitable_for,
        description, status, skus, created_at, updated_at]
      properties:
        product_id:
          type: string
        merchant_id:
          type: string
        category_id:
          type: string
        name:
          type: string
        brand:
          type: string
        image_url:
          type: string
        image_urls:
          type: array
          items:
            type: string
        price:
          $ref: "#/components/schemas/Money"
        market_price:
          $ref: "#/components/schemas/Money"
        stock_quantity:
          type: integer
        stock_status:
          $ref: "#/components/schemas/StockStatus"
        tags:
          type: array
          items:
            type: string
        selling_points:
          type: array
          items:
            type: string
        recommend_reason:
          type: string
        risk_notes:
          type: array
          items:
            type: string
        attributes:
          type: array
          items:
            $ref: "#/components/schemas/ProductAttribute"
        suitable_for:
          type: array
          items:
            type: string
        not_suitable_for:
          type: array
          items:
            type: string
        description:
          type: string
        status:
          type: string
          enum: [active, inactive, risk]
        skus:
          type: array
          items:
            $ref: "#/components/schemas/ProductSku"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    MoneyInput:
      description: 金额，字符串（如 "12.30"）或数字；最多两位小数，不能为负，最大 99999999.99。
      oneOf:
        - type: string
        - type: number
    ProductInput:
      type: object
      description: |
        创建/修改商品。修改时缺省字段不变；创建时 name、category_id 必填，并在 `skus` 与 `price`（+ `stock_quantity`）之间二选一。
        字符串会去掉首尾空白；列表会去掉空白项和重复项。售价 = 默认规格价格，库存 = 各规格库存之和，库存状态由数量推导，不接受客户端指定。
      properties:
        merchant_id:
          type: string
          description: 只能省略或等于当前商家，否则 400。
        name:
          type: string
          maxLength: 128
        brand:
          type: string
          maxLength: 64
        category_id:
          type: string
          description: 必须是已有分类。
        image_url:
          type: string
          description: 主图。只接受 https 链接或平台内图片（`/api/v1/assets/...`，必须存在）；不在 image_urls 中时放到最前。
        image_urls:
          type: array
          maxItems: 9
          items:
            type: string
        price:
          $ref: "#/components/schemas/MoneyInput"
        market_price:
          description: 0 表示不展示划线价；非 0 时不能低于售价。创建时缺省等于售价。
          $ref: "#/components/schemas/MoneyInput"
        stock_quantity:
          type: integer
          minimum: 0
          maximum: 1000000
        stock_status:
          type: string
          deprecated: true
          description: 上游字段，忽略。
        tags:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 16
        selling_points:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 64
        risk_notes:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 64
        suitable_for:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 32
        not_suitable_for:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 32
        attributes:
          type: array
          maxItems: 30
          description: key、value 必填（全空的行忽略），key ≤16、value ≤64、unit ≤8 个字符。
          items:
            $ref: "#/components/schemas/ProductAttribute"
        recommend_reason:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        status:
          type: string
          enum: [active, inactive]
          description: 创建时缺省 active。
        skus:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/SkuInput"
    SkuInput:
      type: object
      required: [sku_name, price, stock_quantity]
      properties:
        sku_id:
          type: string
          description: 修改已有规格时填写，必须属于本商品；创建商品时不能填写。
        sku_name:
          type: string
          maxLength: 64
        price:
          $ref: "#/components/schemas/MoneyInput"
        stock_quantity:
          type: integer
          minimum: 0
          maximum: 1000000
        specs:
          type: object
          maxProperties: 10
          additionalProperties:
            type: string
            maxLength: 32
        is_default:
          type: boolean
          description: 至多一个；都不是时第一个为默认。
    Money:
      type: string
      pattern: "^[0-9]+\\.[0-9]{2}$"
      examples: ["2999.00"]
    Rate:
      type: string
      pattern: "^[01]\\.[0-9]{4}$"
      examples: ["0.9500"]
    StockStatus:
      type: string
      enum: [in_stock, low_stock, out_of_stock]
      description: 库存 0 为 out_of_stock，1–10 为 low_stock。
    CategoryNode:
      type: object
      required: [category_id, parent_id, name, children]
      properties:
        category_id:
          type: string
        parent_id:
          type: string
          description: 一级分类为空串。
        name:
          type: string
        children:
          type: array
          items:
            $ref: "#/components/schemas/CategoryNode"
    Merchant:
      type: object
      required: [merchant_id, name, logo_url, description, service_phone]
      properties:
        merchant_id:
          type: string
        name:
          type: string
        logo_url:
          type: string
        description:
          type: string
        service_phone:
          type: string
    ProductCard:
      type: object
      description: 商品列表项。所有数组字段始终存在（可能为空数组）。
      required: [product_id, sku_id, merchant_id, merchant_name, category_id, name, brand, image_url, price, market_price,
        stock_status, tags, selling_points, recommend_reason, risk_notes]
      properties:
        product_id:
          type: string
        sku_id:
          type: string
          description: 默认 SKU；商品没有 SKU 时为空串。
        merchant_id:
          type: string
        merchant_name:
          type: string
        category_id:
          type: string
        name:
          type: string
        brand:
          type: string
        image_url:
          type: string
          description: 可能是相对地址（`/api/v1/...`），客户端按 API 同源拼接；可能为空串。
        price:
          $ref: "#/components/schemas/Money"
        market_price:
          $ref: "#/components/schemas/Money"
        stock_status:
          $ref: "#/components/schemas/StockStatus"
        tags:
          type: array
          items:
            type: string
        selling_points:
          type: array
          items:
            type: string
        recommend_reason:
          type: string
        risk_notes:
          type: array
          description: 风险提示，例如“不支持游泳佩戴”。
          items:
            type: string
    ProductAttribute:
      type: object
      required: [key, value, unit]
      properties:
        key:
          type: string
        value:
          type: string
        unit:
          type: string
          description: 无单位时为空串。
    ProductDetail:
      allOf:
        - $ref: "#/components/schemas/ProductCard"
        - type: object
          required: [image_urls, stock_quantity, attributes, suitable_for, not_suitable_for, description]
          properties:
            image_urls:
              type: array
              items:
                type: string
            stock_quantity:
              type: integer
              minimum: 0
            attributes:
              type: array
              items:
                $ref: "#/components/schemas/ProductAttribute"
            suitable_for:
              type: array
              description: 适用人群/场景。
              items:
                type: string
            not_suitable_for:
              type: array
              description: 不适用人群/场景。
              items:
                type: string
            description:
              type: string
    ProductSku:
      type: object
      required: [sku_id, product_id, sku_name, price, stock_quantity, stock_status, specs, is_default]
      properties:
        sku_id:
          type: string
        product_id:
          type: string
        sku_name:
          type: string
        price:
          $ref: "#/components/schemas/Money"
        stock_quantity:
          type: integer
          minimum: 0
        stock_status:
          $ref: "#/components/schemas/StockStatus"
        specs:
          type: object
          additionalProperties:
            type: string
        is_default:
          type: boolean
    PublicReview:
      type: object
      required: [review_id, product_id, sku_id, reviewer_name, rating, content, tags, merchant_reply, merchant_replied_at, created_at]
      properties:
        review_id:
          type: string
        product_id:
          type: string
        sku_id:
          type: string
        reviewer_name:
          type: string
          description: 只保留首字符，如“演***”；账户已注销时为“匿名用户”。
        rating:
          type: integer
          minimum: 1
          maximum: 5
        content:
          type: string
        tags:
          type: array
          items:
            type: string
        merchant_reply:
          type: string
          description: 商家未回复时为空串。
        merchant_replied_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
    Promotion:
      type: object
      required: [promotion_id, name, scope, merchant_id, product_id, category_id, type, threshold_amount, discount_amount,
        discount_rate, stackable, start_at, end_at]
      properties:
        promotion_id:
          type: string
        name:
          type: string
        scope:
          type: string
          enum: [platform, merchant, product, category]
        merchant_id:
          type: string
        product_id:
          type: string
        category_id:
          type: string
        type:
          type: string
          enum: [full_reduction, discount]
          description: full_reduction 用 threshold_amount/discount_amount；discount 用 discount_rate（如 0.9500 表示 95 折）。
        threshold_amount:
          $ref: "#/components/schemas/Money"
        discount_amount:
          $ref: "#/components/schemas/Money"
        discount_rate:
          $ref: "#/components/schemas/Rate"
        stackable:
          type: boolean
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
    Role:
      type: string
      enum: [user, merchant, admin]
    AccountStatus:
      type: string
      enum: [active, inactive, risk]
    Account:
      type: object
      description: 账户。不含密码或哈希；`merchant_id` 只在商家账户出现。
      required: [account_id, username, display_name, avatar_url, phone, email, role, status, created_at, updated_at]
      properties:
        account_id:
          type: string
          examples: [acct_seed_user]
        username:
          type: string
        display_name:
          type: string
        avatar_url:
          type: string
          description: 空串表示未设置。
        phone:
          type: string
        email:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        merchant_id:
          type: string
        status:
          $ref: "#/components/schemas/AccountStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Session:
      type: object
      required: [token, token_type, expires_at, account]
      properties:
        token:
          type: string
          description: 不透明 token（43 位 base64url），只在这里出现一次。
        token_type:
          type: string
          const: Bearer
        expires_at:
          type: string
          format: date-time
        account:
          $ref: "#/components/schemas/Account"
    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[A-Za-z0-9_-]+$"
        password:
          type: string
          minLength: 8
          maxLength: 64
          description: 8–64 个字符，且不超过 72 字节。
          format: password
        display_name:
          type: string
          maxLength: 32
          description: 留空时使用用户名。
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    ProfileUpdateRequest:
      type: object
      description: 至少提供昵称或头像之一；空串和缺省都表示不修改。
      properties:
        display_name:
          type: string
          maxLength: 24
        nickname:
          type: string
          maxLength: 24
          description: 兼容字段，`display_name` 为空时使用。
        avatar_url:
          type: string
          description: 必须是本人通过 `POST /uploads/avatar` 上传、且仍存在的头像地址。
    ContactUpdateRequest:
      type: object
      description: 字段缺省表示不修改，空串表示清空；至少提供一个字段。
      properties:
        phone:
          type: string
          maxLength: 32
          pattern: "^[0-9+\\- ]*$"
        email:
          type: string
          maxLength: 128
          description: 空串或合法邮箱地址。
    AvatarUpload:
      type: object
      required: [url, mime_type, size]
      properties:
        url:
          type: string
          examples: [/api/v1/uploads/avatar/acct_seed_user_0123456789abcdef.png]
        mime_type:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        size:
          type: integer
          minimum: 1
          maximum: 2097152
    OKResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ReadyResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          const: ready
        checks:
          type: object
          description: 每个依赖的检查结果。
          additionalProperties:
            type: string
            const: ok
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            机器可读错误码。通用错误码：`invalid_argument`、`invalid_json`、`unauthorized`、`forbidden`、`not_found`、
            `method_not_allowed`、`conflict`、`payload_too_large`、`unsupported_media_type`、`rate_limited`、
            `internal_error`、`not_ready`、`timeout`。认证相关：`invalid_credential`、`username_exists`、
            `account_inactive`、`account_risk`。目录：`product_not_found`。商家：`product_under_review`。
          examples: [not_found]
        message:
          type: string
          description: 可直接展示给用户的中文说明。
          examples: [接口不存在]
        field:
          type: string
          description: 校验失败的请求字段，如 `price`、`skus[1].sku_name`（数组下标从 0 开始）；与具体字段无关的错误不返回。
          examples: ["skus[0].price"]
        request_id:
          type: string
          description: 请求追踪 ID，与响应头 `X-Request-ID` 一致。
    PageMeta:
      type: object
      required: [page, page_size, total]
      properties:
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
    Page:
      description: 列表响应基础结构；具体接口用 allOf 合并并约束 `items` 的元素类型。
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {}
  responses:
    OK:
      description: 操作成功
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OKResponse"
    AccountResponse:
      description: 账户信息
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Account"
    MerchantProductNotFound:
      description: 商品不存在或已删除（`product_not_found`）
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: product_not_found
            message: 商品不存在或已删除
            request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
    ProductNotFound:
      description: 商品不存在，或已下架/风控/删除，或所属商家已停用（`product_not_found`）
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: product_not_found
            message: 商品不存在或已下架
            request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
    AccountStatusForbidden:
      description: 账户状态不允许该操作（`account_inactive` / `account_risk`）
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: account_risk
            message: 账号存在风险，暂时只能浏览
            request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
    BadRequest:
      description: 参数错误或请求体不是合法 JSON（`invalid_argument` / `invalid_json`）
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: invalid_json
            message: 请求体不是合法的 JSON
            request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
    Unauthorized:
      description: 未登录或登录已失效
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: unauthorized
            message: 请先登录
            request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
    Forbidden:
      description: 无权访问该资源
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: forbidden
            message: 没有权限
            request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
    NotFound:
      description: 路径或资源不存在
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: not_found
            message: 接口不存在
            request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
    MethodNotAllowed:
      description: 路径存在但不支持该方法
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Allow:
          $ref: "#/components/headers/Allow"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: method_not_allowed
            message: 不支持该请求方法
            request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
    Conflict:
      description: 幂等、状态或库存冲突
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: conflict
            message: 当前状态不允许该操作
            request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
    PayloadTooLarge:
      description: 请求体或文件过大
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: payload_too_large
            message: 请求体过大
            request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
    UnsupportedMediaType:
      description: 请求体不是 application/json
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: unsupported_media_type
            message: 请求体必须是 application/json
            request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
    TooManyRequests:
      description: 触发限流
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: rate_limited
            message: 请求过于频繁，请稍后再试
            request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
    InternalError:
      description: 服务内部错误（不回显内部细节）
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: internal_error
            message: 服务暂时不可用
            request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
    NotReady:
      description: 依赖不可用，服务尚未就绪
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
