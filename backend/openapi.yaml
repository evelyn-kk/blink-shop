      summary: 采集非结构化资料
      description: |
        content / html / json_text / source_url 四选一。html 去掉脚本、样式、导航等非正文元素，title 为空时取 <title>；
        json_text 展开为“路径: 值”的行（键按名称排序，键顺序不同的同一份 JSON 视为重复）；source_url 由服务端抓取（SSRF 防护见 400 说明，
        最多 3 次重定向，每次都重新检查，8 秒超时，最大 2MB）。清洗后超过 120000 字时截断（truncated=true）。
        文档类型由来源决定：text → unstructured_note，html → web_article，json → structured_note。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestionInput"
      responses:
        "201":
          description: 新建并索引成功
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionResult"
        "200":
          description: 内容与已索引的资料相同（duplicate=true，未重新处理），或重新处理了已有资料（force_reindex / 此前失败）
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionResult"
        "400":
          description: |
            `invalid_argument`：字段不合法（field 指出字段：title、content、html、json_text、source_url、source_type、doc_type、product_id、merchant_id、metadata）；
            `url_not_allowed`：source_url 不是 http(s)、带账号密码、端口不在 80/443/8080/8443，或解析到回环、内网、链路本地、云元数据等保留地址。
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: url_not_allowed
                message: 不能访问内网或保留地址
                field: source_url
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: 相同内容的资料正在处理（`document_processing`），稍后再试
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: document_processing
                message: 相同内容的资料正在处理，请稍后再试
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          description: 写分块失败（`document_index_failed`），文档已记为 failed，可以重新提交相同内容重试
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: document_index_failed
                message: 资料入库失败，已记录为失败状态，请稍后重新提交
        "502":
          description: 网页抓取失败（`source_fetch_failed`）：超时、对方非 2xx、超过 2MB、不是网页/JSON/纯文本、声明了非 UTF-8 编码，或正文含非法 UTF-8 字节（不做替换或删除）
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: source_fetch_failed
                message: 网页抓取失败：对方返回状态码 404
                field: source_url
