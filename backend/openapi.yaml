openapi: 3.1.0
info:
  title: Blink Shop API
  version: 0.8.0
  description: |
    Blink Shop 的单一接口契约。约定：
    - 所有路径前缀为 `/api/v1`，JSON 字段使用 snake_case。
    - 成功响应直接返回业务对象，不包 `data` 外层。
    - 失败响应统一为 `Error`；状态码含义见 `docs/03-api-contract.md`。
    - 每个响应都带 `X-Request-ID`；请求可携带 `X-Request-ID`（1–64 位字母、数字、`.`、`_`、`-`），否则由服务端生成。
    - 请求体上限：JSON 默认 1 MiB；单个上传文件默认 10 MiB（`UPLOAD_MAX_BYTES`），multipart 请求体另留 64 KiB 给表单分隔符；超限返回 413。
    - 未登录请求按客户端 IP 限流，已登录请求另按账号限流，超限返回 429 并带 `Retry-After`。
    - 非流式请求默认 30 秒超时，超时返回 504。
    - 未知路径返回 404，路径存在但方法不支持返回 405（带 `Allow` 头），均为 `Error` JSON。
    - 认证：`Authorization: Bearer <token>`。token 由注册/登录返回，服务端只保存 SHA-256 摘要，默认 24 小时过期（`AUTH_TOKEN_TTL`），登出即撤销。
      token 缺失返回 401 `unauthorized`（请先登录）；过期、撤销或伪造同样 401 `unauthorized`（登录已失效）。
    - 角色：路由分为 public / session / account / user / merchant / admin 六类，角色不符返回 403 `forbidden`；
      商家只能操作自己店铺的资源，越权 403。完整矩阵见 backend/README.md。
    - 账户状态：inactive 只能调用 `GET /auth/me` 与 `POST /auth/logout`，其余 403 `account_inactive`；
      risk 可以读（GET）和登出，任何写操作 403 `account_risk`；两者都不能新登录。已注销账户的 token 全部失效。
    - 分页参数 `page` 从 1 开始，`page_size` 默认 10、最大 100；列表响应使用 `Page` 结构。
      参数缺省或不是整数时取默认值，超出范围时取边界值（与上游一致，不报 400），响应中的 `page`/`page_size` 为实际使用的值。
    - 金额是两位小数的字符串（如 `"2999.00"`），比例是四位小数的字符串（如 `"0.9500"`）。
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
    description: 与当前访问地址同源（本地开发为 http://localhost:8080）
security:
  - bearerAuth: []
tags:
  - name: health
    description: 进程存活与就绪检查
  - name: auth
    description: 注册、登录、登出与当前会话
  - name: account
    description: 个人资料、联系方式、头像与注销
  - name: merchant
    description: 商家后台。merchant_id 一律由登录账号决定；其他商家的资源 403，不存在或已删除 404
  - name: files
    description: 私有文件。只有上传者本人和管理员可以读取；对象存储未配置或不可用时返回 503 `object_storage_unavailable`
  - name: knowledge
    description: |
      知识文档。入库流程：清洗 → 按商家去重（清洗后正文的 SHA-256）→ 切块 → 写分块 → 向量索引（未配置时跳过，检索走关键词）。
      文档状态 uploaded → parsing → indexing → indexed，任一步失败为 failed（error_reason 说明原因），失败或已索引的文档可重新处理。
      商家只能看和提交自己的资料；管理员可以看全部资料，并为任意商家或平台（merchant_id 为空）采集。
  - name: cart
    description: |
      购物车、优惠试算与优惠券（仅普通用户）。金额由服务端计算，规则见 backend/README.md“营销规则”：
      活动按单品 → 品类 → 店铺 → 平台计算，不可叠加的活动只作用于未参加其他活动的商品且这些商品不再参加后续活动和用券；
      之后每个店铺最多用一张店铺券、整单最多一张平台券。discount_rate 为实付比例（0.95 = 9.5 折）。
  - name: catalog
    description: 公开商品目录（无需登录）。只展示上架且商家营业中的商品；下架、风控、已删除商品按不存在处理
paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: 进程存活检查
      description: 只表示进程存活，不检查数据库等依赖；不参与限流。
      security: []
      responses:
        "200":
          description: 进程存活
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /ready:
    get:
      tags: [health]
      operationId: getReady
      summary: 就绪检查
      description: 检查数据库是否可用；不可用时返回 503，具体原因只写服务端日志。不参与限流。
      security: []
      responses:
        "200":
          description: 所有依赖可用
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
              example:
                status: ready
                checks:
                  mysql: ok
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/NotReady"
  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: 注册普通用户
      description: 只能注册 `user` 角色。成功后直接返回会话，等同于登录。用户名不区分大小写，已注销账户的用户名不可复用。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: 注册成功
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: 用户名已存在（`username_exists`）
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: username_exists
                message: 账号已存在
                request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: 用户名密码登录
      description: |
        用户不存在、已注销和密码错误统一返回 401 `invalid_credential`。密码正确但账户 inactive/risk 时返回 403
        `account_inactive` / `account_risk`。同一用户名每分钟最多尝试 `LOGIN_ATTEMPTS_PER_MINUTE` 次（默认 10），超出 429。
        旧版 SHA-256 密码哈希在登录成功后自动升级为 bcrypt。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: 账号或密码错误（`invalid_credential`）
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: invalid_credential
                message: 账号或密码错误
                request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
        "403":
          $ref: "#/components/responses/AccountStatusForbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: 登出
      description: 撤销本次请求使用的 token，同一账户的其他会话不受影响。inactive/risk 账户也可调用。
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: 当前登录账户
      description: inactive/risk 账户也可调用，客户端据 `status` 展示受限提示。
      responses:
        "200":
          $ref: "#/components/responses/AccountResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /account/profile:
    get:
      tags: [account]
      operationId: getProfile
      summary: 读取个人资料
      responses:
        "200":
          $ref: "#/components/responses/AccountResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountStatusForbidden"
    patch:
      tags: [account]
      operationId: updateProfile
      summary: 修改昵称或头像
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdateRequest"
      responses:
        "200":
          $ref: "#/components/responses/AccountResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountStatusForbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /account/contact:
    patch:
      tags: [account]
      operationId: updateContact
      summary: 修改手机号和邮箱
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactUpdateRequest"
      responses:
        "200":
          $ref: "#/components/responses/AccountResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountStatusForbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /account:
    delete:
      tags: [account]
      operationId: deleteAccount
      summary: 注销账户
      description: 软删账户并撤销其全部 token；用户名不可再注册。inactive/risk 账户不能注销。
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountStatusForbidden"
  /uploads/avatar:
    post:
      tags: [account]
      operationId: uploadAvatar
      summary: 上传头像
      description: |
        multipart 字段 `file`，最大 2MB；按文件内容判断类型，只接受 JPG、PNG、WebP。只返回地址，
        需要再调用 `PATCH /account/profile` 设置 `avatar_url`。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  contentMediaType: application/octet-stream
      responses:
        "200":
          description: 上传成功
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarUpload"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountStatusForbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /uploads/avatar/{name}:
    get:
      tags: [account]
      operationId: getAvatar
      summary: 读取头像（公开）
      security: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            pattern: "^acct_[A-Za-z0-9_]{1,64}_[0-9a-f]{16}\\.(jpg|png|webp)$"
      responses:
        "200":
          description: 图片内容
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            image/jpeg: {}
            image/png: {}
            image/webp: {}
        "404":
          $ref: "#/components/responses/NotFound"
  /files:
    post:
      tags: [files]
      operationId: uploadFile
      summary: 上传私有文件
      description: |
        multipart 字段 `file`（其他字段忽略）。服务端边接收边计算大小和 SHA-256，按文件内容嗅探类型，
        客户端声明的 Content-Type 和文件名一律忽略；默认允许 JPG、PNG、WebP、GIF、PDF
        （`UPLOAD_ALLOWED_MIME_TYPES`，只能在 JPG/PNG/WebP/GIF/BMP/PDF 中选择），单个文件默认最大 10 MiB（`UPLOAD_MAX_BYTES`）。
        文件保存到对象存储，key 随机生成且不对外返回；先写对象再写元数据，任一步失败都不会留下文件记录。
        所有已登录角色可用；inactive / risk 账户不能上传。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  contentMediaType: application/octet-stream
      responses:
        "201":
          description: 上传成功
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileUpload"
        "400":
          description: |
            `invalid_argument`：缺少 `file` 分段、文件为空或 multipart 格式错误（field=file 表示文件本身的问题）；
            `unsupported_file_type`：内容不是允许的类型（field=file）。
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: unsupported_file_type
                message: 不支持该文件类型，仅支持 JPG、PNG、WEBP、GIF、PDF
                field: file
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountStatusForbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/ObjectStorageUnavailable"
  /files/{id}:
    get:
      tags: [files]
      operationId: getFile
      summary: 下载私有文件
      description: |
        只有上传者本人和管理员可以读取，其他账号 403。成功时直接返回文件字节：`Content-Type` 为上传时嗅探出的类型，
        带 `X-Content-Type-Options: nosniff`、`Content-Security-Policy: default-src 'none'; sandbox`，
        图片 `Content-Disposition: inline`，其他类型 `attachment`；`Cache-Control: private, max-age=3600`，
        `ETag` 为内容 SHA-256，带匹配的 `If-None-Match` 时返回 304。
        Web 端 `<img>` 无法携带 Bearer token，需要用带 token 的请求取回内容后生成 blob URL（见 frontend/src/api/files.ts），
        不能把 token 放进 URL。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: "^file_[A-Za-z0-9_]{1,64}$"
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: 文件内容
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            ETag:
              schema:
                type: string
            Content-Disposition:
              schema:
                type: string
          content:
            image/jpeg: {}
            image/png: {}
            image/webp: {}
            image/gif: {}
            image/bmp: {}
            application/pdf: {}
        "304":
          description: 内容未变化
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 不是上传者本人也不是管理员（`forbidden`），或账户已停用（`account_inactive`）
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: forbidden
                message: 无权访问该文件
        "404":
          description: 文件不存在（`file_not_found`）
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: file_not_found
                message: 文件不存在
        "503":
          $ref: "#/components/responses/ObjectStorageUnavailable"
  /merchant/documents:
    get:
      tags: [knowledge]
      operationId: listMerchantDocuments
      summary: 我的资料
      description: 当前商家的资料，最近修改的在前。
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/DocumentStatus"
        - name: keyword
          in: query
          required: false
          description: 按标题包含匹配。
          schema:
            type: string
            maxLength: 64
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 资料分页列表（不含正文）
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/KnowledgeDocument"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [knowledge]
      operationId: createMerchantDocument
      summary: 提交资料
      description: |
        商家直接提交的文字资料（按纯文本清洗）。与上游一致返回文档本身：新建 201；清洗后内容与本店已有资料相同时 200 返回已有文档；
        force_reindex=true 时用本次的标题、类型、商品和元数据重新处理同一篇文档（200）。doc_type 默认 product_detail；
        faq 类型按“问：/Q:”切成问答块。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentInput"
      responses:
        "201":
          description: 新建并索引成功
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDocument"
        "200":
          description: 重复内容（返回已有文档）或重新处理了已有文档
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDocument"
        "400":
          description: |
            `invalid_argument`：字段不合法（field 指出字段：title、content、html、json_text、source_url、source_type、doc_type、product_id、merchant_id、metadata）；
            `url_not_allowed`：source_url 不是 http(s)、带账号密码、端口不在 80/443/8080/8443，或解析到回环、内网、链路本地、云元数据等保留地址。
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: url_not_allowed
                message: 不能访问内网或保留地址
                field: source_url
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: 相同内容的资料正在处理（`document_processing`），稍后再试
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: document_processing
                message: 相同内容的资料正在处理，请稍后再试
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          description: 写分块失败（`document_index_failed`），文档已记为 failed，可以重新提交相同内容重试
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: document_index_failed
                message: 资料入库失败，已记录为失败状态，请稍后重新提交
  /merchant/documents/{id}:
    get:
      tags: [knowledge]
      operationId: getMerchantDocument
      summary: 资料详情
      description: 只能查看本店资料；其他商家和平台资料 403。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 资料详情，含清洗后的正文和全部分块
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDocumentDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: 资料不存在（`document_not_found`）
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: document_not_found
                message: 资料不存在
  /merchant/unstructured-ingestions:
    post:
      tags: [knowledge]
      operationId: createMerchantIngestion
      summary: 采集非结构化资料
      description: |
        content / html / json_text / source_url 四选一。html 去掉脚本、样式、导航等非正文元素，title 为空时取 <title>；
        json_text 展开为“路径: 值”的行（键按名称排序，键顺序不同的同一份 JSON 视为重复）；source_url 由服务端抓取（SSRF 防护见 400 说明，
        最多 3 次重定向，每次都重新检查，8 秒超时，最大 2MB）。清洗后超过 120000 字时截断（truncated=true）。
        文档类型由来源决定：text → unstructured_note，html → web_article，json → structured_note。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestionInput"
      responses:
        "201":
          description: 新建并索引成功
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionResult"
        "200":
          description: 内容与已索引的资料相同（duplicate=true，未重新处理），或重新处理了已有资料（force_reindex / 此前失败）
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionResult"
        "400":
          description: |
            `invalid_argument`：字段不合法（field 指出字段：title、content、html、json_text、source_url、source_type、doc_type、product_id、merchant_id、metadata）；
            `url_not_allowed`：source_url 不是 http(s)、带账号密码、端口不在 80/443/8080/8443，或解析到回环、内网、链路本地、云元数据等保留地址。
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: url_not_allowed
                message: 不能访问内网或保留地址
                field: source_url
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: 相同内容的资料正在处理（`document_processing`），稍后再试
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: document_processing
                message: 相同内容的资料正在处理，请稍后再试
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          description: 写分块失败（`document_index_failed`），文档已记为 failed，可以重新提交相同内容重试
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: document_index_failed
                message: 资料入库失败，已记录为失败状态，请稍后重新提交
        "502":
          description: 网页抓取失败（`source_fetch_failed`）：超时、对方非 2xx、超过 2MB、不是网页/JSON/纯文本、声明了非 UTF-8 编码，或正文含非法 UTF-8 字节（不做替换或删除）
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: source_fetch_failed
                message: 网页抓取失败：对方返回状态码 404
                field: source_url
