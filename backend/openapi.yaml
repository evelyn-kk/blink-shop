  /admin/configs/{key}:
    patch:
      tags: [admin]
      operationId: updateAdminConfig
      summary: 修改配置
      description: |
        只能修改运行中可调的配置（editable=true），写入动态配置后立即生效，并写操作审计；空值表示恢复默认值。
        密钥和只在启动时读取的配置 409 `config_read_only`；由环境变量指定的 409 `config_overridden_by_env`；值不合法 400（field=value）。
        上游可以新建任意键、不校验类型；这里只接受已注册的键。
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  type: string
      responses:
        "200":
          description: 修改后的配置项
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`config_not_found`"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: config_not_found
                message: 配置项不存在
        "409":
          description: "`config_read_only` 或 `config_overridden_by_env`"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: config_read_only
                message: 该配置只在启动时读取，不能在运行中修改
