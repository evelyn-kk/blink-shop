        "403":
          $ref: "#/components/responses/Forbidden"
  /cart/items:
    post:
      tags: [cart]
      operationId: addCartItem
      summary: 加购
      description: |
        商品必须公开可见；不传 sku_id 时使用默认规格，不传 quantity 为 1。同一规格再次加购累加数量并重新选中（同一账户、商品、规格只有一行，
        并发加购不会产生重复行或丢失数量）。累加后的数量不能超过库存和单行上限 99；购物车最多 100 种商品。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id]
              properties:
                product_id:
                  type: string
                sku_id:
                  type: string
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 99
                  default: 1
      responses:
        "200":
          description: 操作后的整个购物车
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: 商品不存在、未上架或店铺停业（`product_not_found`）
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: product_not_found
                message: 商品不存在或已下架
        "409":
          description: "`out_of_stock` 售罄；`insufficient_stock` 累加后超过库存；`quantity_limit` 超过单行 99 件；`cart_full` 购物车已满 100 种商品"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: insufficient_stock
                message: 库存不足，最多可买 5 件
  /cart/items/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      tags: [cart]
      operationId: updateCartItem
      summary: 修改数量或选中状态
      description: |
        quantity 必须是 1–99 且不超过当前库存（0 和负数不会当作删除）。按更新后的状态判断：改数量，或更新后为选中时，
        商品必须可以购买且数量不超过库存，否则 409；因此不可购买的项不能被选中（selected:true 被拒绝），
        只能取消选中、删除，或把“库存不足”的数量改到库存以内（可同时选中）。被拒绝的请求不改变购物车。
        只能修改本人的购物车项，其他人的按不存在处理（404）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 99
                selected:
                  type: boolean
      responses:
        "200":
          description: 操作后的整个购物车
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: 购物车项不存在（`cart_item_not_found`）
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
