  /orders:checkout:
    post:
      tags: [orders]
      operationId: checkout
      summary: 结算下单
      description: |
        把购物车中已选中的商品按店铺拆成多个订单，在一个数据库事务内完成：锁定购物车项、商品和规格库存、未使用的券 →
        按最新价格、库存、活动和券重新计价（与 `GET /cart/discount-preview` 同一套计算）→ 创建订单、订单项和待支付的支付单 →
        扣减库存 → 核销券 → 删除已结算的购物车项。任何一步不满足都整体失败：不创建订单、不扣库存、不核销券、不清购物车。

        幂等：幂等键放在 `Idempotency-Key` 请求头或 `idempotency_key` 字段（必填；两处都给时必须相同）。同一账户同一个键成功下单后，
        再次请求直接返回那次的订单（200，`replayed=true`，订单为当前状态），不会重复下单或扣库存；失败的请求不占用这个键。

        下单后 30 分钟内未支付的订单自动关闭（库存回补、券退回）。平台券可以分摊到多个店铺的订单上，这些订单全部取消后才退回。
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: 幂等键，1–128 位字母、数字或 `.` `_` `:` `-`；也可以放在请求体。
          schema:
            type: string
            pattern: "^[A-Za-z0-9._:-]{1,128}$"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
      responses:
        "201":
          description: 下单成功
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResult"
        "200":
          description: 同一幂等键已经成功下过单，返回那次的订单
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResult"
        "400":
          description: |
            `invalid_argument`：缺少幂等键或格式不对（field=idempotency_key）、券 ID 超过 20 个；
            `empty_cart`：购物车里没有选中的商品；`coupon_not_applicable`：指定的券不能用（field=user_coupon_ids）
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: empty_cart
                message: 请先在购物车选择要结算的商品
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: |
            `item_unavailable`：选中的商品已下架、删除、规格失效、售罄或数量超过库存（不会悄悄跳过）；
            `price_changed`：传了 expected_pay_amount 且与重新计算的实付金额不同（message 中给出新金额）
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: item_unavailable
                message: 「Blink 护眼台灯 L1」商品已下架，请先在购物车里处理
