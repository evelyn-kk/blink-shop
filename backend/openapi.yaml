  /orders/{id}/items/{item_id}:review:
    post:
      tags: [orders]
      operationId: reviewOrderItem
      summary: 评价订单商品
      description: 只能评价自己已完成订单里的商品，每件商品只能评价一次。评价立即公开（`GET /products/{id}/reviews`）。
      parameters:
