        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: not_ready
            message: 依赖 mysql 不可用
            request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
    GatewayTimeout:
      description: 请求处理超时
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: timeout
            message: 请求处理超时，请稍后重试
            request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
