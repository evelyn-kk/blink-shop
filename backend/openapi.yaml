  /cart/discount-preview:
    get:
      tags: [cart]
      operationId: previewCartDiscount
      summary: 优惠试算
      description: 只计算已选中且可购买的项。只做试算，不会占用或核销券；4.2 下单使用同一套计算。
      parameters:
        - name: user_coupon_ids
          in: query
          required: false
          description: 不传时自动选择最优券；传了（逗号分隔，可以为空值）只使用这些券，空值表示不用券。最多 20 张。
          schema:
            type: string
      responses:
        "200":
          description: 试算结果
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscountPreview"
        "400":
          description: 指定的券不能用（`coupon_not_applicable`，field=user_coupon_ids）：不属于本人、已使用、已过期、未开始、已停用、门槛不够、没有适用商品，或同一范围指定了多张
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: coupon_not_applicable
                message: 优惠券不能使用：未满足使用门槛或没有适用商品
                field: user_coupon_ids
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /cart/items:
    post:
      tags: [cart]
      operationId: addCartItem
      summary: 加购
      description: |
        商品必须公开可见；不传 sku_id 时使用默认规格，不传 quantity 为 1。同一规格再次加购累加数量并重新选中（同一账户、商品、规格只有一行，
        并发加购不会产生重复行或丢失数量）。累加后的数量不能超过库存和单行上限 99；购物车最多 100 种商品。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id]
              properties:
                product_id:
                  type: string
                sku_id:
                  type: string
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 99
                  default: 1
      responses:
        "200":
          description: 操作后的整个购物车
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: 商品不存在、未上架或店铺停业（`product_not_found`）
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: product_not_found
                message: 商品不存在或已下架
        "409":
          description: "`out_of_stock` 售罄；`insufficient_stock` 累加后超过库存；`quantity_limit` 超过单行 99 件；`cart_full` 购物车已满 100 种商品"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: insufficient_stock
                message: 库存不足，最多可买 5 件
  /cart/items/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      tags: [cart]
      operationId: updateCartItem
      summary: 修改数量或选中状态
      description: quantity 必须是 1–99 且不超过当前库存（0 和负数不会当作删除）；已失效的商品只能取消选中或删除。只能修改本人的购物车项，其他人的按不存在处理（404）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 99
                selected:
                  type: boolean
      responses:
        "200":
          description: 操作后的整个购物车
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: 购物车项不存在（`cart_item_not_found`）
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: cart_item_not_found
                message: 购物车项不存在
        "409":
          description: "`insufficient_stock` 超过库存；`out_of_stock` 已售罄；`item_unavailable` 商品已下架、删除或规格失效"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: item_unavailable
                message: 商品已失效，只能删除
    delete:
      tags: [cart]
      operationId: deleteCartItem
      summary: 删除购物车项
      responses:
        "200":
          description: 操作后的整个购物车
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: 购物车项不存在（`cart_item_not_found`）
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: cart_item_not_found
                message: 购物车项不存在
  /coupons/available:
    get:
      tags: [cart]
      operationId: listAvailableCoupons
      summary: 可领取的优惠券
      description: active、在有效期 [start_at, end_at) 内、店铺券的店铺营业中的券（含已领完的，can_claim=false），最新的在前。
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 优惠券分页列表
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/AvailableCoupon"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /coupons/mine:
    get:
      tags: [cart]
      operationId: listMyCoupons
      summary: 我的优惠券
      description: 按领取时间倒序。状态按当前时间计算：未使用但已到期的为 expired。
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [unused, used, expired]
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 我的优惠券分页列表
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/UserCoupon"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /coupons/{coupon_id}:claim:
    post:
      tags: [cart]
      operationId: claimCoupon
      summary: 领券
      description: 与上游一致，动作写在路径段内（`/coupons/coupon_seed_digital:claim`）。锁定券行后检查有效期、总量（total_count 为 0 不限）和每人限领，并发领取不会超发。
      parameters:
        - name: coupon_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 领取成功
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserCoupon"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: 券不存在（`coupon_not_found`）
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: coupon_not_found
                message: 优惠券不存在
        "409":
          description: "`coupon_unavailable` 不在有效期、已停用或店铺停业；`coupon_sold_out` 已领完；`coupon_limit_reached` 达到每人限领"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: coupon_limit_reached
                message: 已达到这张券的领取上限
  /merchant/products:
    get:
      tags: [merchant]
      operationId: listMerchantProducts
      summary: 我的商品
      description: 当前商家的全部未删除商品（含下架、风控），最近修改的在前。上游没有这个接口（上游商家页从公开列表中筛选，看不到下架商品）。
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, inactive, risk]
        - name: keyword
          in: query
          required: false
          description: 按商品名称包含匹配。
          schema:
            type: string
            maxLength: 64
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 商品分页列表
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/MerchantProduct"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [merchant]
      operationId: createMerchantProduct
      summary: 创建商品
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: 创建成功
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantProduct"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /merchant/products/{id}:
    get:
      tags: [merchant]
      operationId: getMerchantProduct
      summary: 我的商品详情（含全部规格和状态）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 商品
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantProduct"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/MerchantProductNotFound"
    patch:
      tags: [merchant]
      operationId: updateMerchantProduct
      summary: 修改商品（部分更新）
      description: |
        只修改请求中出现的字段。`status` 只能在 active / inactive 之间切换（上架/下架）；风控中的商品不能自行上下架（409），
        但可以修改资料。`skus` 提交时整体替换规格列表：带 `sku_id` 的更新该规格（必须属于本商品），不带的新增，未出现的删除。
        只提交 `price` / `stock_quantity` 时修改默认规格。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "200":
          description: 修改后的商品
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantProduct"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/MerchantProductNotFound"
        "409":
          description: 风控审核中的商品不能自行上下架（`product_under_review`）
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: product_under_review
                message: 商品正在风控审核，不能自行上下架
                request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
    delete:
      tags: [merchant]
      operationId: deleteMerchantProduct
      summary: 删除商品（软删）
      description: 状态改为 deleted（终态）。公开目录和商家列表不再出现，订单快照不受影响。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 已删除
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                type: object
                required: [product_id, status]
                properties:
                  product_id:
                    type: string
                  status:
                    type: string
                    const: deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/MerchantProductNotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 登录后获得的不透明 token。
  headers:
    RequestID:
      description: 请求追踪 ID，与错误响应体中的 `request_id` 一致。
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,64}$"
    RetryAfter:
      description: 距离限流窗口重置的秒数。
      schema:
        type: integer
        minimum: 1
    Allow:
      description: 该路径支持的方法。
      schema:
        type: string
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: 页码，从 1 开始。
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      description: 每页条数，默认 10，最大 100。
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
  schemas:
    MerchantProduct:
      type: object
      description: 商家后台看到的商品：比公开结构多状态、全部规格和时间，不含商家名。
      required: [product_id, merchant_id, category_id, name, brand, image_url, image_urls, price, market_price, stock_quantity,
        stock_status, tags, selling_points, recommend_reason, risk_notes, attributes, suitable_for, not_suitable_for,
        description, status, skus, created_at, updated_at]
      properties:
        product_id:
          type: string
        merchant_id:
          type: string
        category_id:
          type: string
        name:
          type: string
        brand:
          type: string
        image_url:
          type: string
        image_urls:
          type: array
          items:
            type: string
        price:
          $ref: "#/components/schemas/Money"
        market_price:
          $ref: "#/components/schemas/Money"
        stock_quantity:
          type: integer
        stock_status:
          $ref: "#/components/schemas/StockStatus"
        tags:
          type: array
          items:
            type: string
        selling_points:
          type: array
          items:
            type: string
        recommend_reason:
          type: string
        risk_notes:
          type: array
          items:
            type: string
        attributes:
          type: array
          items:
            $ref: "#/components/schemas/ProductAttribute"
        suitable_for:
          type: array
          items:
            type: string
        not_suitable_for:
          type: array
          items:
            type: string
        description:
          type: string
        status:
          type: string
          enum: [active, inactive, risk]
        skus:
          type: array
          items:
            $ref: "#/components/schemas/ProductSku"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    MoneyInput:
      description: 金额，字符串（如 "12.30"）或数字；最多两位小数，不能为负，最大 99999999.99。
      oneOf:
        - type: string
        - type: number
    ProductInput:
      type: object
      description: |
        创建/修改商品。修改时缺省字段不变；创建时 name、category_id 必填，并在 `skus` 与 `price`（+ `stock_quantity`）之间二选一。
        字符串会去掉首尾空白；列表会去掉空白项和重复项。除 `description` 外的文本字段（名称、品牌、规格名及其属性、
        推荐理由、标签等列表项、参数）都是单行：含换行、制表符、回车、U+2028/U+2029 或其他控制字符返回 400 并指出 field；
        `description` 允许换行和制表符（`\r\n` 统一为 `\n`），其他控制字符同样拒绝。售价 = 默认规格价格，库存 = 各规格库存之和，库存状态由数量推导，不接受客户端指定。
      properties:
        merchant_id:
          type: string
          description: 只能省略或等于当前商家，否则 400。
        name:
          type: string
          maxLength: 128
        brand:
          type: string
          maxLength: 64
        category_id:
          type: string
          description: 必须是已有分类。
        image_url:
          type: string
          description: 主图。只接受 https 链接或平台内图片（`/api/v1/assets/...`，必须存在）；不在 image_urls 中时放到最前。
        image_urls:
          type: array
          maxItems: 9
          items:
            type: string
        price:
          $ref: "#/components/schemas/MoneyInput"
        market_price:
          description: 0 表示不展示划线价；非 0 时不能低于售价。创建时缺省等于售价。
          $ref: "#/components/schemas/MoneyInput"
        stock_quantity:
          type: integer
          minimum: 0
          maximum: 1000000
        stock_status:
          type: string
          deprecated: true
          description: 上游字段，忽略。
        tags:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 16
        selling_points:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 64
        risk_notes:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 64
        suitable_for:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 32
        not_suitable_for:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 32
        attributes:
          type: array
          maxItems: 30
          description: key、value 必填（全空的行忽略），key ≤16、value ≤64、unit ≤8 个字符。
          items:
            $ref: "#/components/schemas/ProductAttribute"
        recommend_reason:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        status:
          type: string
          enum: [active, inactive]
          description: 创建时缺省 active。
        skus:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/SkuInput"
    SkuInput:
      type: object
      required: [sku_name, price, stock_quantity]
      properties:
        sku_id:
          type: string
          description: 修改已有规格时填写，必须属于本商品；创建商品时不能填写。
        sku_name:
          type: string
          maxLength: 64
        price:
          $ref: "#/components/schemas/MoneyInput"
        stock_quantity:
          type: integer
          minimum: 0
          maximum: 1000000
        specs:
          type: object
          maxProperties: 10
          additionalProperties:
            type: string
            maxLength: 32
        is_default:
          type: boolean
          description: 至多一个；都不是时第一个为默认。
    Money:
      type: string
      pattern: "^[0-9]+\\.[0-9]{2}$"
      examples: ["2999.00"]
    Rate:
      type: string
      pattern: "^[01]\\.[0-9]{4}$"
      examples: ["0.9500"]
    StockStatus:
      type: string
      enum: [in_stock, low_stock, out_of_stock]
      description: 库存 0 为 out_of_stock，1–10 为 low_stock。
    CategoryNode:
      type: object
      required: [category_id, parent_id, name, children]
      properties:
        category_id:
          type: string
        parent_id:
          type: string
          description: 一级分类为空串。
        name:
          type: string
        children:
          type: array
          items:
            $ref: "#/components/schemas/CategoryNode"
    Merchant:
      type: object
      required: [merchant_id, name, logo_url, description, service_phone]
      properties:
        merchant_id:
          type: string
        name:
          type: string
        logo_url:
          type: string
        description:
          type: string
        service_phone:
          type: string
    ProductCard:
      type: object
      description: 商品列表项。所有数组字段始终存在（可能为空数组）。
      required: [product_id, sku_id, merchant_id, merchant_name, category_id, name, brand, image_url, price, market_price,
        stock_status, tags, selling_points, recommend_reason, risk_notes]
      properties:
        product_id:
          type: string
        sku_id:
          type: string
          description: 默认 SKU；商品没有 SKU 时为空串。
        merchant_id:
          type: string
        merchant_name:
          type: string
        category_id:
          type: string
        name:
          type: string
        brand:
          type: string
        image_url:
          type: string
          description: 可能是相对地址（`/api/v1/...`），客户端按 API 同源拼接；可能为空串。
        price:
          $ref: "#/components/schemas/Money"
        market_price:
          $ref: "#/components/schemas/Money"
        stock_status:
          $ref: "#/components/schemas/StockStatus"
        tags:
          type: array
          items:
            type: string
        selling_points:
          type: array
          items:
            type: string
        recommend_reason:
          type: string
        risk_notes:
          type: array
          description: 风险提示，例如“不支持游泳佩戴”。
          items:
            type: string
    ProductAttribute:
      type: object
      required: [key, value, unit]
      properties:
        key:
          type: string
        value:
          type: string
        unit:
          type: string
          description: 无单位时为空串。
    ProductDetail:
      allOf:
        - $ref: "#/components/schemas/ProductCard"
        - type: object
          required: [image_urls, stock_quantity, attributes, suitable_for, not_suitable_for, description]
          properties:
            image_urls:
              type: array
              items:
                type: string
            stock_quantity:
              type: integer
              minimum: 0
            attributes:
              type: array
              items:
                $ref: "#/components/schemas/ProductAttribute"
            suitable_for:
              type: array
              description: 适用人群/场景。
              items:
                type: string
            not_suitable_for:
              type: array
              description: 不适用人群/场景。
              items:
                type: string
            description:
              type: string
    ProductSku:
      type: object
      required: [sku_id, product_id, sku_name, price, stock_quantity, stock_status, specs, is_default]
      properties:
        sku_id:
          type: string
        product_id:
          type: string
        sku_name:
          type: string
        price:
          $ref: "#/components/schemas/Money"
        stock_quantity:
          type: integer
          minimum: 0
        stock_status:
          $ref: "#/components/schemas/StockStatus"
        specs:
          type: object
          additionalProperties:
            type: string
        is_default:
          type: boolean
    PublicReview:
      type: object
      required: [review_id, product_id, sku_id, reviewer_name, rating, content, tags, merchant_reply, merchant_replied_at, created_at]
      properties:
        review_id:
          type: string
        product_id:
          type: string
        sku_id:
          type: string
        reviewer_name:
          type: string
          description: 只保留首字符，如“演***”；账户已注销时为“匿名用户”。
        rating:
          type: integer
          minimum: 1
          maximum: 5
        content:
          type: string
        tags:
          type: array
          items:
            type: string
        merchant_reply:
          type: string
          description: 商家未回复时为空串。
        merchant_replied_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
    Promotion:
      type: object
      required: [promotion_id, name, scope, merchant_id, product_id, category_id, type, threshold_amount, discount_amount,
        discount_rate, stackable, start_at, end_at]
      properties:
        promotion_id:
          type: string
        name:
          type: string
        scope:
          type: string
          enum: [platform, merchant, product, category]
        merchant_id:
          type: string
        product_id:
          type: string
        category_id:
          type: string
        type:
          type: string
          enum: [full_reduction, discount]
          description: full_reduction 用 threshold_amount/discount_amount；discount 用 discount_rate（如 0.9500 表示 95 折）。
        threshold_amount:
          $ref: "#/components/schemas/Money"
        discount_amount:
          $ref: "#/components/schemas/Money"
        discount_rate:
          $ref: "#/components/schemas/Rate"
        stackable:
          type: boolean
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
    Role:
      type: string
      enum: [user, merchant, admin]
    AccountStatus:
      type: string
      enum: [active, inactive, risk]
    Account:
      type: object
      description: 账户。不含密码或哈希；`merchant_id` 只在商家账户出现。
      required: [account_id, username, display_name, avatar_url, phone, email, role, status, created_at, updated_at]
      properties:
        account_id:
          type: string
          examples: [acct_seed_user]
        username:
          type: string
        display_name:
          type: string
        avatar_url:
          type: string
          description: 空串表示未设置。
        phone:
          type: string
        email:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        merchant_id:
          type: string
        status:
          $ref: "#/components/schemas/AccountStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Session:
      type: object
      required: [token, token_type, expires_at, account]
      properties:
        token:
          type: string
          description: 不透明 token（43 位 base64url），只在这里出现一次。
        token_type:
          type: string
          const: Bearer
        expires_at:
          type: string
          format: date-time
        account:
          $ref: "#/components/schemas/Account"
    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[A-Za-z0-9_-]+$"
        password:
          type: string
          minLength: 8
          maxLength: 64
          description: 8–64 个字符，且不超过 72 字节。
          format: password
        display_name:
          type: string
          maxLength: 32
          description: 留空时使用用户名。
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    ProfileUpdateRequest:
      type: object
      description: 至少提供昵称或头像之一；空串和缺省都表示不修改。
      properties:
        display_name:
          type: string
          maxLength: 24
        nickname:
          type: string
          maxLength: 24
          description: 兼容字段，`display_name` 为空时使用。
        avatar_url:
          type: string
          description: 必须是本人通过 `POST /uploads/avatar` 上传、且仍存在的头像地址。
    ContactUpdateRequest:
      type: object
      description: 字段缺省表示不修改，空串表示清空；至少提供一个字段。
      properties:
        phone:
          type: string
          maxLength: 32
          pattern: "^[0-9+\\- ]*$"
        email:
          type: string
          maxLength: 128
          description: 空串或合法邮箱地址。
    AvatarUpload:
      type: object
      required: [url, mime_type, size]
      properties:
        url:
          type: string
          examples: [/api/v1/uploads/avatar/acct_seed_user_0123456789abcdef.png]
        mime_type:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        size:
          type: integer
          minimum: 1
          maximum: 2097152
    DocumentStatus:
      type: string
      enum: [uploaded, parsing, indexing, indexed, failed]
    DocType:
      type: string
      enum: [product_detail, faq, policy, guide, web_article, structured_note, unstructured_note]
    DocumentMetadata:
      type: object
      maxProperties: 20
      description: 扁平的附加信息：键 1–64 字，值只能是字符串（≤500 字）、数字、布尔或 null，整体不超过 4KB。
      additionalProperties:
        oneOf:
          - type: string
            maxLength: 500
          - type: number
          - type: boolean
          - type: "null"
    KnowledgeDocument:
      type: object
      required: [document_id, merchant_id, product_id, title, doc_type, status, chunk_count, source_url, content_hash, metadata, error_reason, created_at, updated_at]
      properties:
        document_id:
          type: string
        merchant_id:
          type: string
          description: 空串表示平台资料。
        product_id:
          type: string
          description: 关联的商品，可为空。
        title:
          type: string
          maxLength: 120
        doc_type:
          $ref: "#/components/schemas/DocType"
        status:
          $ref: "#/components/schemas/DocumentStatus"
        chunk_count:
          type: integer
          minimum: 0
        source_url:
          type: string
          description: 采集网页时为最终地址（跟随重定向后）。
        content_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: 清洗后正文的 SHA-256，同一商家内唯一。
        metadata:
          $ref: "#/components/schemas/DocumentMetadata"
        error_reason:
          type: string
          description: status 为 failed 时的原因。
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    KnowledgeDocumentDetail:
      allOf:
        - $ref: "#/components/schemas/KnowledgeDocument"
        - type: object
          required: [content, chunks]
          properties:
            content:
              type: string
              description: 清洗后的正文。
            chunks:
              type: array
              items:
                type: object
                required: [chunk_id, chunk_index, title, content]
                properties:
                  chunk_id:
                    type: string
                  chunk_index:
                    type: integer
                  title:
                    type: string
                  content:
                    type: string
                    maxLength: 800
    DocumentInput:
      type: object
      required: [title, content]
      properties:
        merchant_id:
          type: string
          description: 只能为空或当前商家，其他值 400（field=merchant_id）。
        title:
          type: string
          maxLength: 120
          description: 单行，不能含换行或控制字符。
        content:
          type: string
        doc_type:
          $ref: "#/components/schemas/DocType"
        product_id:
          type: string
          description: 必须是本店未删除的商品。
        metadata:
          $ref: "#/components/schemas/DocumentMetadata"
        force_reindex:
          type: boolean
    IngestionInput:
      type: object
      description: content、html、json_text、source_url 必须且只能提供一个。
      properties:
        merchant_id:
          type: string
          description: 只能为空或当前商家。
        title:
          type: string
          maxLength: 120
          description: 为空时从 <title> 或正文第一行推断。
        source_type:
          type: string
          enum: [text, html, json]
          description: 指定 content 或抓取结果的解析方式；为空时按字段或响应 Content-Type 判断。
        content:
          type: string
        html:
          type: string
        json_text:
          type: string
        source_url:
          type: string
          format: uri
          maxLength: 1024
        product_id:
          type: string
        metadata:
          $ref: "#/components/schemas/DocumentMetadata"
        force_reindex:
          type: boolean
    AdminIngestionInput:
      allOf:
        - $ref: "#/components/schemas/IngestionInput"
        - type: object
          properties:
            merchant_id:
              type: string
              description: 为空或不传时是平台资料；否则必须是已存在的商家。
    IngestionResult:
      type: object
      required: [document, duplicate, text_runes, truncated]
      properties:
        document:
          $ref: "#/components/schemas/KnowledgeDocument"
        duplicate:
          type: boolean
        text_runes:
          type: integer
          description: 清洗后正文的字数。
        truncated:
          type: boolean
          description: 清洗后超过 120000 字被截断。
    CartItem:
      type: object
      required: [cart_item_id, product_id, sku_id, product_name, sku_name, image_url, merchant_id, merchant_name, unit_price, quantity, selected, stock_quantity, available, unavailable_reason, amount, discount_amount, pay_amount]
      properties:
        cart_item_id:
          type: string
        product_id:
          type: string
        sku_id:
          type: string
        product_name:
          type: string
        sku_name:
          type: string
        image_url:
          type: string
        merchant_id:
          type: string
        merchant_name:
          type: string
        unit_price:
          $ref: "#/components/schemas/Money"
        quantity:
          type: integer
          minimum: 1
          maximum: 99
        selected:
          type: boolean
        stock_quantity:
          type: integer
        available:
          type: boolean
        unavailable_reason:
          type: string
          description: 商品已删除 / 商品已下架 / 规格已失效 / 已售罄 / 库存不足，仅剩 N 件；可购买时为空串。
        amount:
          $ref: "#/components/schemas/Money"
        discount_amount:
          $ref: "#/components/schemas/Money"
          description: 分摊到该项的优惠；未选中或不可购买时为 0。
        pay_amount:
          $ref: "#/components/schemas/Money"
    Cart:
      type: object
      required: [items, summary]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        summary:
          type: object
          required: [item_count, selected_count, total_amount, discount_amount, pay_amount]
          properties:
            item_count:
              type: integer
              description: 购物车行数。
            selected_count:
              type: integer
              description: 参与计价（选中且可购买）的商品件数。
            total_amount:
              $ref: "#/components/schemas/Money"
            discount_amount:
              $ref: "#/components/schemas/Money"
            pay_amount:
              $ref: "#/components/schemas/Money"
    DiscountPreview:
      type: object
      required: [total_amount, discount_amount, pay_amount, lines, merchants, items, hints, user_coupon_ids]
      properties:
        total_amount:
          $ref: "#/components/schemas/Money"
        discount_amount:
          $ref: "#/components/schemas/Money"
        pay_amount:
          $ref: "#/components/schemas/Money"
        lines:
          type: array
          description: 逐项优惠，按计算顺序排列。
          items:
            type: object
            required: [type, id, name, scope, merchant_id, amount, description, cart_item_ids]
            properties:
              type:
                type: string
                enum: [promotion, coupon]
              id:
                type: string
                description: promotion_id 或 user_coupon_id。
              name:
                type: string
              scope:
                type: string
                enum: [platform, merchant, product, category]
              merchant_id:
                type: string
              amount:
                $ref: "#/components/schemas/Money"
              description:
                type: string
                examples: [满 300 减 30, 9.5 折]
              cart_item_ids:
                type: array
                description: 这条优惠分摊到的购物车项。
                items:
                  type: string
        merchants:
          type: array
          description: 按店铺小计（4.2 按店铺拆单）。
          items:
            type: object
            required: [merchant_id, merchant_name, total_amount, discount_amount, pay_amount]
            properties:
              merchant_id:
                type: string
              merchant_name:
                type: string
              total_amount:
                $ref: "#/components/schemas/Money"
              discount_amount:
                $ref: "#/components/schemas/Money"
              pay_amount:
                $ref: "#/components/schemas/Money"
        items:
          type: array
          items:
            type: object
            required: [cart_item_id, amount, discount_amount, pay_amount]
            properties:
              cart_item_id:
                type: string
              amount:
                $ref: "#/components/schemas/Money"
              discount_amount:
                $ref: "#/components/schemas/Money"
              pay_amount:
                $ref: "#/components/schemas/Money"
        hints:
          type: array
          description: 满减活动还差多少金额达到门槛（凑单提示）。
          items:
            type: object
            required: [promotion_id, name, shortfall]
            properties:
              promotion_id:
                type: string
              name:
                type: string
              shortfall:
                $ref: "#/components/schemas/Money"
        user_coupon_ids:
          type: array
          description: 实际使用的券。
          items:
            type: string
    Coupon:
      type: object
      required: [coupon_id, name, scope, merchant_id, type, threshold_amount, discount_amount, description, total_count, claimed_count, per_user_limit, start_at, end_at]
      properties:
        coupon_id:
          type: string
        name:
          type: string
        scope:
          type: string
          enum: [platform, merchant]
        merchant_id:
          type: string
        type:
          type: string
          enum: [fixed_amount]
        threshold_amount:
          $ref: "#/components/schemas/Money"
        discount_amount:
          $ref: "#/components/schemas/Money"
        description:
          type: string
          examples: [满 200 减 20]
        total_count:
          type: integer
          description: 0 表示不限量。
        claimed_count:
          type: integer
        per_user_limit:
          type: integer
          minimum: 1
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
          description: 不含该时刻。
    AvailableCoupon:
      allOf:
        - $ref: "#/components/schemas/Coupon"
        - type: object
          required: [claimed_by_me, can_claim]
          properties:
            claimed_by_me:
              type: integer
            can_claim:
              type: boolean
    UserCoupon:
      type: object
      required: [user_coupon_id, coupon_id, status, order_id, claimed_at, used_at, coupon]
      properties:
        user_coupon_id:
          type: string
        coupon_id:
          type: string
        status:
          type: string
          enum: [unused, used, expired]
        order_id:
          type: string
        claimed_at:
          type: string
          format: date-time
        used_at:
          type: [string, "null"]
          format: date-time
        coupon:
          $ref: "#/components/schemas/Coupon"
    FileUpload:
      type: object
      required: [file]
      properties:
        file:
          $ref: "#/components/schemas/StoredFile"
    StoredFile:
      type: object
      required: [file_id, url, mime_type, size_bytes, content_hash, created_at]
      properties:
        file_id:
          type: string
          examples: [file_0123456789abcdef01234567]
        url:
          type: string
          description: 下载地址（需要登录，见 `GET /files/{id}`）。
          examples: [/api/v1/files/file_0123456789abcdef01234567]
        mime_type:
          type: string
          enum: [image/jpeg, image/png, image/webp, image/gif, image/bmp, application/pdf]
        size_bytes:
          type: integer
          minimum: 1
        content_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: 内容的 SHA-256（小写 hex）。
        created_at:
          type: string
          format: date-time
    OKResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ReadyResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          const: ready
        checks:
          type: object
          description: 每个依赖的检查结果。
          additionalProperties:
            type: string
            const: ok
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            机器可读错误码。通用错误码：`invalid_argument`、`invalid_json`、`unauthorized`、`forbidden`、`not_found`、
            `method_not_allowed`、`conflict`、`payload_too_large`、`unsupported_media_type`、`rate_limited`、
            `internal_error`、`not_ready`、`timeout`。认证相关：`invalid_credential`、`username_exists`、
            `account_inactive`、`account_risk`。目录：`product_not_found`。商家：`product_under_review`。
          examples: [not_found]
        message:
          type: string
          description: 可直接展示给用户的中文说明。
          examples: [接口不存在]
        field:
          type: string
          description: 校验失败的请求字段，如 `price`、`skus[1].sku_name`（数组下标从 0 开始）；与具体字段无关的错误不返回。
          examples: ["skus[0].price"]
        request_id:
          type: string
          description: 请求追踪 ID，与响应头 `X-Request-ID` 一致。
    PageMeta:
      type: object
      required: [page, page_size, total]
      properties:
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
    Page:
      description: 列表响应基础结构；具体接口用 allOf 合并并约束 `items` 的元素类型。
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {}
  responses:
    OK:
      description: 操作成功
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OKResponse"
    AccountResponse:
      description: 账户信息
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Account"
    MerchantProductNotFound:
      description: 商品不存在或已删除（`product_not_found`）
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: product_not_found
            message: 商品不存在或已删除
            request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
    ProductNotFound:
      description: 商品不存在，或已下架/风控/删除，或所属商家已停用（`product_not_found`）
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: product_not_found
            message: 商品不存在或已下架
            request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
    AccountStatusForbidden:
      description: 账户状态不允许该操作（`account_inactive` / `account_risk`）
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: account_risk
            message: 账号存在风险，暂时只能浏览
            request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
    BadRequest:
      description: 参数错误或请求体不是合法 JSON（`invalid_argument` / `invalid_json`）
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: invalid_json
            message: 请求体不是合法的 JSON
            request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
    Unauthorized:
      description: 未登录或登录已失效
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: unauthorized
            message: 请先登录
            request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
    Forbidden:
      description: 无权访问该资源
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: forbidden
            message: 没有权限
            request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
    NotFound:
      description: 路径或资源不存在
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: not_found
            message: 接口不存在
            request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
    MethodNotAllowed:
      description: 路径存在但不支持该方法
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Allow:
          $ref: "#/components/headers/Allow"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: method_not_allowed
            message: 不支持该请求方法
            request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
    Conflict:
      description: 幂等、状态或库存冲突
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: conflict
            message: 当前状态不允许该操作
            request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
    ObjectStorageUnavailable:
      description: 对象存储未配置或暂时不可用（`object_storage_unavailable`）
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: object_storage_unavailable
            message: 文件存储暂不可用，请稍后再试
    PayloadTooLarge:
      description: 请求体或文件过大
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: payload_too_large
            message: 请求体过大
            request_id: 6f1c2a9e0b7d4c3e8a5f1b2c
    UnsupportedMediaType:
      description: 请求体不是 application/json
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: unsupported_media_type
